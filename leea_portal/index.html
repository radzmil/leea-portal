<!DOCTYPE html>
<html lang="ms" x-data="appData()" x-init="init()" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEEA System - AI Digital Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-950 text-gray-100 font-sans antialiased min-h-screen flex flex-col">

    <header class="bg-gray-900/85 backdrop-blur-md border-b border-blue-500/20 sticky top-0 z-30 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center glow-effect shadow-md">
                    <i class="fa-solid fa-microchip text-white text-sm"></i>
                </div>
                <span class="font-black text-lg tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-300">LEEA AI SYSTEM</span>
            </div>

            <template x-if="isLoggedIn">
                <div class="flex items-center space-x-4 font-mono text-xs">
                    <div @click="clientTab = 'affiliate'" class="flex items-center space-x-2 px-3 py-1.5 bg-gray-950 border border-emerald-500/40 rounded-xl cursor-pointer hover:bg-emerald-950/20 transition shadow">
                        <i class="fa-solid fa-wallet text-emerald-400"></i>
                        <div>
                            <span class="text-[9px] text-gray-400 block uppercase leading-none">E-Wallet</span>
                            <span class="font-bold text-emerald-400 text-xs" x-text="'RM ' + affiliateData.walletBalance.toFixed(2)"></span>
                        </div>
                    </div>

                    <button @click="showInboxModal = true" class="relative p-2 rounded-xl bg-gray-800/60 hover:bg-gray-800 text-blue-300 transition">
                        <i class="fa-solid fa-bell text-sm"></i>
                        <span class="absolute top-1 right-1 w-2.5 h-2.5 bg-red-500 rounded-full blinking-red-dot" x-show="hasUnreadMessages"></span>
                    </button>

                    <button @click="logout()" class="text-red-400 hover:text-red-300 p-2 transition" title="Log Keluar">
                        <i class="fa-solid fa-power-off"></i>
                    </button>
                </div>
            </template>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col justify-center space-y-6">
        <!-- Skrin Login Klien -->
        <template x-if="!isLoggedIn">
            <div class="max-w-md mx-auto space-y-6 w-full">
                <div class="ai-digital-bg rounded-3xl p-6 md:p-8 text-white shadow-2xl glow-effect cyber-border backdrop-blur-md">
                    <h2 class="text-sm font-mono font-bold text-blue-400 mb-4 uppercase tracking-wider">Log Masuk Klien Portal</h2>
                    <form @submit.prevent="login()" class="space-y-4 font-mono text-xs">
                        <div>
                            <label class="block uppercase text-blue-400 mb-1">Username Klien</label>
                            <input type="text" x-model="loginForm.username" required class="w-full px-4 py-2.5 bg-gray-950 border border-gray-800 rounded-xl text-blue-100 focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block uppercase text-blue-400 mb-1">Password</label>
                            <input type="password" x-model="loginForm.password" required class="w-full px-4 py-2.5 bg-gray-950 border border-gray-800 rounded-xl text-blue-100 focus:outline-none focus:border-blue-500">
                        </div>
                        <div class="text-red-400 font-semibold" x-text="loginError"></div>
                        <button type="submit" class="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold rounded-xl shadow-lg glow-effect transition hover:opacity-90">AKSES PORTAL</button>
                    </form>
                </div>
            </div>
        </template>

        <!-- Skrin Dashboard Utama Selepas Log Masuk -->
        <template x-if="isLoggedIn">
            <div class="space-y-6 w-full animate-fade-in">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="ai-digital-bg border border-blue-500/30 rounded-2xl p-6 shadow-xl glow-effect">
                        <span class="text-gray-400 text-xs font-mono uppercase">Status Akaun</span>
                        <div class="text-xl font-bold text-emerald-400 mt-2" x-text="currentUser ? currentUser.status : 'Paid 🟢'"></div>
                    </div>
                    <div class="ai-digital-bg border border-blue-500/30 rounded-2xl p-6 shadow-xl glow-effect">
                        <span class="text-gray-400 text-xs font-mono uppercase">ID Klien</span>
                        <div class="text-xl font-bold text-blue-400 mt-2" x-text="currentUser ? currentUser.clientId : 'CLI-1001'"></div>
                    </div>
                    <div class="ai-digital-bg border border-blue-500/30 rounded-2xl p-6 shadow-xl glow-effect">
                        <span class="text-gray-400 text-xs font-mono uppercase">Tarikh Tamat Tempoh</span>
                        <div class="text-xl font-bold text-indigo-400 mt-2" x-text="currentUser ? currentUser.expiryDate : '27/09/2026'"></div>
                    </div>
                </div>

                <div class="ai-digital-bg border border-blue-500/30 rounded-3xl p-8 shadow-2xl text-center py-16 glow-effect cyber-border">
                    <div class="w-16 h-16 mx-auto rounded-2xl bg-blue-600/20 border border-blue-500/40 flex items-center justify-center mb-4 glow-effect">
                        <i class="fa-solid fa-robot text-2xl text-blue-400"></i>
                    </div>
                    <h3 class="text-xl font-bold text-white tracking-wide">Selamat Datang ke Leea AI Portal</h3>
                    <p class="text-gray-400 text-xs font-mono mt-2">Sistem automasi, pangkalan data, dan pengurusan bot klien anda aktif beroperasi sepenuhnya.</p>
                </div>
            </div>
        </template>
    </main>

    <script src="app.js"></script>
</body>
</html>
