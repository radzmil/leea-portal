<!DOCTYPE html>
<html lang="ms" x-data="appData()" x-init="init()" :class="{ 'dark': darkMode }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEEA System - Portal Rasmi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#059669',
                        darkBg: '#0f172a'
                    }
                }
            }
        }
    </script>
    <style>
        .malaysia-theme-bg {
            background: linear-gradient(135deg, #0b1f4c 0%, #1d3557 60%, #1e293b 100%);
            position: relative;
            overflow: hidden;
        }
        .malaysia-theme-bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 15% 20%, rgba(220, 38, 38, 0.25) 0%, transparent 45%),
                        radial-gradient(circle at 85% 80%, rgba(245, 158, 11, 0.2) 0%, transparent 45%);
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-darkBg text-gray-800 dark:text-gray-100 font-sans antialiased min-h-screen flex flex-col transition-colors duration-200">

    <header class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="font-black text-lg tracking-wider text-emerald-600 dark:text-emerald-400">LEEA SYSTEM</span>
            </div>

            <div class="flex items-center space-x-4">
                <button @click="toggleLang()" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 transition">
                    <span x-text="lang === 'ms' ? 'English (EN)' : 'Bahasa Melayu (BM)'"></span>
                </button>

                <button @click="darkMode = !darkMode" class="p-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg">
                    <i :class="darkMode ? 'fa-solid fa-sun' : 'fa-solid fa-moon'"></i>
                </button>

                <template x-if="isLoggedIn">
                    <div class="flex items-center space-x-3 border-l pl-4 border-gray-200 dark:border-gray-700">
                        <div class="text-right">
                            <span class="block text-sm font-bold" x-text="currentUser.username"></span>
                            <span class="text-xs text-emerald-600 dark:text-emerald-400 capitalize" x-text="currentUser.role + ' (' + currentUser.clientId + ')'"></span>
                        </div>
                        <button @click="logout()" class="text-red-500 hover:text-red-700 p-2" title="Log Keluar">
                            <i class="fa-solid fa-right-from-bracket"></i>
                        </button>
                    </div>
                </template>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col justify-center">

        <template x-if="!isLoggedIn">
            <div class="max-w-xl mx-auto space-y-6 w-full">
                <!-- Tema Hari Malaysia dengan Rekaan Latar Belakang & Countdown Menuju 16 September 2026 -->
                <div class="malaysia-theme-bg rounded-3xl p-6 md:p-8 text-white shadow-2xl relative border border-amber-500/30 backdrop-blur-md">
                    <div class="absolute top-4 right-6 opacity-15 text-8xl font-black pointer-events-none">🇲🇾</div>
                    
                    <div class="flex justify-between items-center mb-4 relative z-10">
                        <div class="flex space-x-2">
                            <span class="w-3 h-3 rounded-full bg-blue-600 inline-block shadow-md"></span>
                            <span class="w-3 h-3 rounded-full bg-yellow-400 inline-block shadow-md"></span>
                            <span class="w-3 h-3 rounded-full bg-red-600 inline-block shadow-md"></span>
                        </div>
                        <span class="text-[10px] uppercase tracking-widest bg-red-600 text-white px-3 py-1 rounded-full font-extrabold shadow-md border border-red-400/40">★ 16 September ★</span>
                    </div>

                    <div class="text-center space-y-1 mb-5 relative z-10">
                        <h2 class="text-2xl md:text-3xl font-black tracking-wider uppercase text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-white to-red-400 drop-shadow-sm">
                            HAPPY MALAYSIA DAY
                        </h2>
                        <p class="text-xs md:text-sm text-yellow-100 font-semibold tracking-wide">Malaysia Madani Jiwa Merdeka</p>
                    </div>

                    <!-- Kotak Countdown (Hari, Jam, Minit, Saat) hingga 16 September 2026 -->
                    <div class="grid grid-cols-4 gap-2 text-center bg-black/40 backdrop-blur-md p-3.5 rounded-2xl border border-white/15 mb-6 shadow-inner relative z-10">
                        <div>
                            <div class="text-xl md:text-2xl font-black text-yellow-300" x-text="countdown.days">00</div>
                            <div class="text-[9px] uppercase tracking-wider text-gray-300 font-bold">Hari</div>
                        </div>
                        <div>
                            <div class="text-xl md:text-2xl font-black text-white" x-text="countdown.hours">00</div>
                            <div class="text-[9px] uppercase tracking-wider text-gray-300 font-bold">Jam</div>
                        </div>
                        <div>
                            <div class="text-xl md:text-2xl font-black text-white" x-text="countdown.minutes">00</div>
                            <div class="text-[9px] uppercase tracking-wider text-gray-300 font-bold">Minit</div>
                        </div>
                        <div>
                            <div class="text-xl md:text-2xl font-black text-red-400" x-text="countdown.seconds">00</div>
                            <div class="text-[9px] uppercase tracking-wider text-gray-300 font-bold">Saat</div>
                        </div>
                    </div>

                    <!-- Kotak Borang Log Masuk -->
                    <div class="bg-white dark:bg-gray-800 text-gray-900 dark:text-white rounded-2xl shadow-xl overflow-hidden border border-gray-200 dark:border-gray-700 p-6 md:p-8 relative z-10">
                        <div class="text-center mb-6">
                            <h3 class="text-xl font-black uppercase tracking-wider">SISTEM LEEA</h3>
                            <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Sistem Automasi AI Bot Untuk Whatsapp</p>
                        </div>

                        <form @submit.prevent="login()" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold uppercase text-gray-600 dark:text-gray-400 mb-1" x-text="lang === 'ms' ? 'Nama Pengguna' : 'Username'"></label>
                                <input type="text" x-model="loginForm.username" required class="w-full px-4 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-gray-600 dark:text-gray-400 mb-1" x-text="lang === 'ms' ? 'Kata Laluan' : 'Password'"></label>
                                <input type="password" x-model="loginForm.password" required class="w-full px-4 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                            </div>
                            <div class="text-red-500 text-xs" x-text="loginError"></div>
                            <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg transition shadow-lg" x-text="lang === 'ms' ? 'Log Masuk' : 'Sign In'"></button>
                        </form>
                    </div>
                </div>

                <div class="text-center">
                    <a href="https://wa.link/mvtkdr" target="_blank" class="inline-flex items-center justify-center space-x-2 px-5 py-3 bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold rounded-xl shadow-md transition transform hover:-translate-y-0.5">
                        <span class="relative flex h-3 w-3">
                          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                          <span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
                        </span>
                        <i class="fa-brands fa-whatsapp text-sm text-green-300"></i>
                        <span x-text="lang === 'ms' ? 'Live Support WhatsApp' : 'WhatsApp Live Support'"></span>
                    </a>
                </div>
            </div>
        </template>

        <template x-if="isLoggedIn && currentUser.role === 'client'">
            <div class="space-y-6">
                <div class="bg-gradient-to-r from-emerald-600 to-teal-700 rounded-2xl p-6 text-white shadow-lg flex justify-between items-center">
                    <div>
                        <h1 class="text-2xl font-bold" x-text="(lang === 'ms' ? 'Selamat Datang, ' : 'Welcome, ') + currentUser.username"></h1>
                        <p class="text-emerald-100 text-sm mt-1" x-text="(lang === 'ms' ? 'ID Klien: ' : 'Client ID: ') + currentUser.clientId + ' | Pakej Standard (RM130/bulan)'"></p>
                    </div>
                    <div class="bg-white/10 px-4 py-2 rounded-xl backdrop-blur-md text-right">
                        <span class="block text-xs text-emerald-200" x-text="lang === 'ms' ? 'Tarikh Luput' : 'Expiry Date'"></span>
                        <span class="font-bold text-sm" x-text="currentUser.expiryDate"></span>
                    </div>
                </div>

                <div class="flex space-x-2 border-b border-gray-200 dark:border-gray-700 pb-2 overflow-x-auto">
                    <button @click="clientTab = 'dashboard'" :class="clientTab === 'dashboard' ? 'bg-emerald-600 text-white' : 'bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300'" class="px-4 py-2 rounded-lg font-medium text-sm transition shadow-sm whitespace-nowrap">
                        <i class="fa-solid fa-chart-line mr-2"></i> Dashboard & Analytics
                    </button>
                    <button @click="clientTab = 'livechat'" :class="clientTab === 'livechat' ? 'bg-emerald-600 text-white' : 'bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300'" class="px-4 py-2 rounded-lg font-medium text-sm transition shadow-sm whitespace-nowrap">
                        <i class="fa-solid fa-comments mr-2"></i> <span x-text="lang === 'ms' ? 'Live Chat & Kawalan Bot' : 'Live Chat & Bot Control'"></span>
                    </button>
                    <button @click="clientTab = 'brainbot'" :class="clientTab === 'brainbot' ? 'bg-emerald-600 text-white' : 'bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300'" class="px-4 py-2 rounded-lg font-medium text-sm transition shadow-sm whitespace-nowrap">
                        <i class="fa-solid fa-brain mr-2"></i> <span x-text="lang === 'ms' ? 'Tetapan Brain Bot' : 'Brain Bot Settings'"></span>
                    </button>
                    <button @click="clientTab = 'billing'" :class="clientTab === 'billing' ? 'bg-emerald-600 text-white' : 'bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300'" class="px-4 py-2 rounded-lg font-medium text-sm transition shadow-sm whitespace-nowrap">
                        <i class="fa-solid fa-credit-card mr-2"></i> <span x-text="lang === 'ms' ? 'Langganan & Bil' : 'Subscription & Billing'"></span>
                    </button>
                    <button @click="clientTab = 'profile'" :class="clientTab === 'profile' ? 'bg-emerald-600 text-white' : 'bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300'" class="px-4 py-2 rounded-lg font-medium text-sm transition shadow-sm whitespace-nowrap">
                        <i class="fa-solid fa-user-gear mr-2"></i> <span x-text="lang === 'ms' ? 'Profil & Tetapan' : 'Profile & Settings'"></span>
                    </button>
                </div>

                <div x-show="clientTab === 'dashboard'" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                        <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700">
                            <span class="text-xs font-semibold text-gray-400 uppercase" x-text="lang === 'ms' ? 'Jumlah WhatsApp Chat' : 'Total WhatsApp Chats'"></span>
                            <h3 class="text-3xl font-extrabold mt-2 text-emerald-600" x-text="getTotalChatCount()">0</h3>
                            <span class="text-xs text-gray-400 mt-1 block" x-text="lang === 'ms' ? 'Kira secara realtime dari server bot' : 'Counted in realtime from bot server'"></span>
                        </div>
                        
                        <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700">
                            <span class="text-xs font-semibold text-gray-400 uppercase" x-text="lang === 'ms' ? 'Chat Hari Ini' : 'Chats Today'"></span>
                            <h3 class="text-3xl font-extrabold mt-2 text-indigo-600" x-text="getTodayChatCount()">0</h3>
                            <span class="text-xs text-gray-400 mt-1 block" x-text="lang === 'ms' ? 'Nombor unik / mesej hari ini' : 'Unique numbers / today'"></span>
                        </div>

                        <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700">
                            <span class="text-xs font-semibold text-gray-400 uppercase" x-text="lang === 'ms' ? 'Chat Sebulan (Aktif)' : 'Monthly Chats'"></span>
                            <h3 class="text-3xl font-extrabold mt-2 text-amber-600" x-text="getMonthlyChatCount()">0</h3>
                            <span class="text-xs text-gray-400 mt-1 block" x-text="lang === 'ms' ? 'Jumlah interaksi bulan ini' : 'Total interaction this month'"></span>
                        </div>

                        <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700">
                            <span class="text-xs font-semibold text-gray-400 uppercase" x-text="lang === 'ms' ? 'Status Akaun' : 'Account Status'"></span>
                            <h3 class="text-2xl font-extrabold mt-2 text-emerald-600" x-text="currentUser.status"></h3>
                            <span class="text-xs text-gray-400 mt-1 block" x-text="(lang === 'ms' ? 'Auto-renew aktif' : 'Auto-renew active')"></span>
                        </div>
                    </div>

                    <!-- Bahagian Analisis Eksklusif & Status Sistem -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 md:col-span-2 space-y-4">
                            <div class="flex justify-between items-center">
                                <h3 class="font-bold text-base" x-text="lang === 'ms' ? 'Prestasi Interaksi Bot Mingguan' : 'Weekly Bot Interaction Performance'"></h3>
                                <span class="text-xs bg-emerald-100 text-emerald-700 dark:bg-emerald-900/50 dark:text-emerald-300 px-2.5 py-1 rounded-full font-semibold">Live Metrics</span>
                            </div>
                            <div class="grid grid-cols-2 gap-4 pt-2">
                                <div class="p-4 bg-gray-50 dark:bg-gray-700/40 rounded-xl">
                                    <span class="text-xs text-gray-400 uppercase font-semibold">AI Bot Handled</span>
                                    <div class="text-2xl font-black text-emerald-600 mt-1" x-text="getAiHandledPercentage()">0%</div>
                                    <span class="text-[10px] text-gray-500 mt-0.5 block">Diselesaikan sepenuhnya oleh AI</span>
                                </div>
                                <div class="p-4 bg-gray-50 dark:bg-gray-700/40 rounded-xl">
                                    <span class="text-xs text-gray-400 uppercase font-semibold">Human Touch Intervention</span>
                                    <div class="text-2xl font-black text-amber-600 mt-1">10%</div>
                                    <span class="text-[10px] text-gray-500 mt-0.5 block">Diambil alih oleh agen manusia</span>
                                </div>
                            </div>
                        </div>

                        <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 space-y-4">
                            <h3 class="font-bold text-base" x-text="lang === 'ms' ? 'Status Kesihatan Sistem' : 'System Health Status'"></h3>
                            <div class="space-y-3 pt-2 text-xs">
                                <div class="flex justify-between items-center p-2.5 bg-gray-50 dark:bg-gray-700/40 rounded-xl">
                                    <span class="font-semibold">Meta WhatsApp API</span>
                                    <span class="px-2 py-0.5 bg-emerald-100 text-emerald-700 font-bold rounded-full">Operational 🟢</span>
                                </div>
                                <div class="flex justify-between items-center p-2.5 bg-gray-50 dark:bg-gray-700/40 rounded-xl">
                                    <span class="font-semibold">Gemini AI Brain</span>
                                    <span class="px-2 py-0.5 bg-emerald-100 text-emerald-700 font-bold rounded-full">Active 🟢</span>
                                </div>
                                <div class="flex justify-between items-center p-2.5 bg-gray-50 dark:bg-gray-700/40 rounded-xl">
                                    <span class="font-semibold">Google Sheets DB</span>
                                    <span class="px-2 py-0.5 bg-emerald-100 text-emerald-700 font-bold rounded-full">Synced 🟢</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div x-show="clientTab === 'livechat'" class="space-y-6">
                    <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 space-y-3">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-center">
                            <div class="flex items-center space-x-3">
                                <div class="p-3 bg-emerald-100 dark:bg-emerald-900/50 text-emerald-600 rounded-xl">
                                    <i class="fa-solid fa-ticket text-xl"></i>
                                </div>
                                <div>
                                    <span class="text-xs font-semibold uppercase text-gray-400" x-text="lang === 'ms' ? 'BAKI KUOTA TOKEN LEEA SISTEM' : 'REMAINING TOKEN QUOTA'"></span>
                                    <div class="text-xl font-black text-gray-900 dark:text-white">
                                        <span x-text="getRemainingFreeQuota()">1000</span> / 1,000 <span class="text-xs font-normal text-gray-500">chat</span>
                                    </div>
                                </div>
                            </div>
                            <div class="text-right">
                                <span class="text-xs font-semibold text-gray-500 uppercase block">Anggaran Caj Semasa Meta:</span>
                                <span class="text-xl font-bold text-red-600" x-text="calculateMetaCost()">RM 0.00</span>
                            </div>
                        </div>
                        <div class="bg-amber-50 dark:bg-amber-900/30 border border-amber-200 dark:border-amber-700/50 rounded-xl p-3 text-xs text-amber-800 dark:text-amber-200 flex items-start space-x-2">
                            <i class="fa-solid fa-triangle-exclamation mt-0.5"></i>
                            <div>
                                <span class="font-bold">Notifikasi Penting:</span> Selepas habis token percuma 1,000 chat, sistem akan secara automatik mencaj mengikut kadar token Meta (RM0.003 bagi setiap chat tambahan). Klien dinasihatkan memantau penggunaan kuota di sini.
                            </div>
                        </div>
                    </div>

                    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden">
                        <div class="p-4 border-b dark:border-gray-700 flex justify-between items-center bg-gray-50 dark:bg-gray-700/50">
                            <h3 class="font-bold text-base" x-text="lang === 'ms' ? 'Pusat Kawalan Live Chat & Bot' : 'Live Chat & Bot Control Center'"></h3>
                            <span class="px-3 py-1 bg-emerald-100 dark:bg-emerald-900 text-emerald-700 dark:text-emerald-300 rounded-full text-xs font-semibold flex items-center">
                                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping mr-2"></span> Live Connected
                            </span>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-12 min-h-[500px]">
                            <div class="md:col-span-5 border-r border-gray-200 dark:border-gray-700 overflow-y-auto max-h-[550px] divide-y divide-gray-100 dark:divide-gray-700">
                                <template x-for="chat in liveChats" :key="chat.id">
                                    <div @click="selectActiveChat(chat)" 
                                         class="p-4 cursor-pointer transition hover:bg-gray-50 dark:hover:bg-gray-700/50 flex flex-col space-y-1"
                                         :class="activeChat && activeChat.id === chat.id ? 'bg-emerald-50 dark:bg-emerald-900/20 border-l-4 border-emerald-600' : ''">
                                        <div class="flex justify-between items-center">
                                            <span class="font-bold text-sm text-gray-900 dark:text-white" x-text="chat.phone"></span>
                                            <span class="text-[10px] text-gray-400" x-text="chat.time"></span>
                                        </div>
                                        <div class="text-xs text-gray-500 dark:text-gray-400 truncate" x-text="chat.lastMessage"></div>
                                        <div class="flex justify-between items-center pt-1">
                                            <span class="text-[10px] px-2 py-0.5 rounded-full font-bold uppercase"
                                                  :class="chat.mode === 'ai' ? 'bg-blue-100 text-blue-700' : 'bg-amber-100 text-amber-700'"
                                                  x-text="chat.mode === 'ai' ? 'AI Bot' : 'Human Touch'"></span>
                                        </div>
                                    </div>
                                </template>
                            </div>

                            <div class="md:col-span-7 flex flex-col bg-slate-50/50 dark:bg-gray-900/30">
                                <template x-if="!activeChat">
                                    <div class="flex flex-col items-center justify-center flex-grow p-8 text-center text-gray-400">
                                        <i class="fa-solid fa-comments text-4xl mb-3 text-emerald-500/50"></i>
                                        <p class="text-sm font-semibold" x-text="lang === 'ms' ? 'Sila pilih kotak chat.' : 'Please select a chat.'"></p>
                                    </div>
                                </template>

                                <template x-if="activeChat">
                                    <div class="flex flex-col h-full flex-grow">
                                        <div class="p-3 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center shadow-xs">
                                            <h4 class="font-bold text-sm text-gray-900 dark:text-white" x-text="activeChat.phone"></h4>
                                            <button @click="toggleChatMode(activeChat.id)" class="px-3 py-1.5 rounded-lg text-xs font-bold text-white transition shadow" :class="activeChat.mode === 'ai' ? 'bg-amber-600' : 'bg-emerald-600'">
                                                <span x-text="activeChat.mode === 'ai' ? 'Tukar ke Human' : 'Tukar ke AI'"></span>
                                            </button>
                                        </div>

                                        <div class="p-4 overflow-y-auto space-y-3 flex-grow max-h-[380px]">
                                            <template x-for="msg in activeChat.messages">
                                                <div class="flex" :class="msg.sender === 'customer' ? 'justify-start' : 'justify-end'">
                                                    <div class="max-w-[80%] rounded-2xl px-4 py-2 text-xs shadow-sm" :class="msg.sender === 'customer' ? 'bg-white dark:bg-gray-700 text-gray-800 border' : 'bg-emerald-600 text-white'">
                                                        <p x-text="msg.text"></p>
                                                        <span class="text-[9px] block text-right mt-1 opacity-70" x-text="msg.time"></span>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>

                                        <div class="p-3 bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700">
                                            <form @submit.prevent="sendReplyMessage()" class="flex items-center space-x-2">
                                                <input type="text" x-model="replyText" placeholder="Taip mesej balas..." class="flex-grow px-4 py-2 border rounded-xl text-xs dark:bg-gray-700 dark:border-gray-600">
                                                <button type="submit" class="px-4 py-2 bg-emerald-600 text-white text-xs font-bold rounded-lg">Hantar</button>
                                            </form>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>

                <div x-show="clientTab === 'brainbot'" class="space-y-6">

    <script>
        function appData() {
            return {
                lang: 'ms',
                darkMode: false,
                isLoggedIn: false,
                clientTab: 'dashboard',
                loginForm: { username: '', password: '' },
                loginError: '',
                currentUser: null,
                clients: [],
                activeChat: null,
                replyText: '',
                showClientModal: false,
                modalMode: 'add',
                editIndex: null,
                clientForm: { username: '', password: '', phone: '', email: '', railwayUrl: '' },
                clientProfileForm: { username: '', phone: '', email: '', newPassword: '' },
                brainPrompt: 'Anda adalah pembantu peribadi digital rasmi LEEA System. Bantu pelanggan dengan mesra, profesional, dan berikan maklumat tepat berkaitan perkhidmatan kami.',
                liveChats: [],
                countdown: { days: 0, hours: 0, minutes: 0, seconds: 0 },

                init() {
                    this.fetchClientsFromBot();
                    this.startCountdown();
                    
                    const hash = window.location.hash.replace('#', '');
                    const savedUser = localStorage.getItem('leea_current_user');

                    if (hash) {
                        setTimeout(() => {
                            const foundClient = this.clients.find(c => c.clientId === hash);
                            if (foundClient) {
                                this.currentUser = { username: foundClient.username, clientId: foundClient.clientId, role: 'client', status: foundClient.status, expiryDate: foundClient.expiryDate };
                                this.isLoggedIn = true;
                                this.loadClientProfileData();
                                this.fetchLiveChats();
                            }
                        }, 200);
                    } else if (savedUser) {
                        this.currentUser = JSON.parse(savedUser);
                        this.isLoggedIn = true;
                        if (this.currentUser.role === 'client') {
                            this.loadClientProfileData();
                            this.fetchLiveChats();
                        }
                    }

                    setInterval(() => {
                        if (this.isLoggedIn && this.currentUser && this.currentUser.role === 'client') {
                            this.fetchLiveChats();
                        }
                    }, 5000);
                },

                startCountdown() {
                    const targetDate = new Date('September 16, 2026 00:00:00').getTime();
                    
                    setInterval(() => {
                        const now = new Date().getTime();
                        const difference = targetDate - now;

                        if (difference > 0) {
                            this.countdown.days = Math.floor(difference / (1000 * 60 * 60 * 24));
                            this.countdown.hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                            this.countdown.minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                            this.countdown.seconds = Math.floor((difference % (1000 * 60)) / 1000);
                        } else {
                            this.countdown = { days: 0, hours: 0, minutes: 0, seconds: 0 };
                        }
                    }, 1000);
                },

                fetchClientsFromBot() {
                    const savedClients = localStorage.getItem('leea_admin_clients');
                    if (savedClients) {
                        this.clients = JSON.parse(savedClients);
                    } else {
                        this.clients = [
                            { clientId: 'CLI-1001', username: 'sbltransport', password: 'securepass456', phone: '+60132434200', email: 'architechlabs.io@gmail.com', railwayUrl: 'https://web-production-00fc.up.railway.app', status: 'Paid 🟢', expiryDate: '27/09/2026' },
                            { clientId: 'CLI-1002', username: 'architechlaboratory', password: 'H@$$ayang8683', phone: '+601123687357', email: 'radzmil@gmail.com', railwayUrl: 'https://leeasystem-production.up.railway.app', status: 'Paid 🟢', expiryDate: '27/09/2026' }
                        ];
                        localStorage.setItem('leea_admin_clients', JSON.stringify(this.clients));
                    }
                },

                saveClientsToStorage() {
                    localStorage.setItem('leea_admin_clients', JSON.stringify(this.clients));
                },

                async backupClientToGoogleDrive(clientData) {
                    const backupUrl = "https://script.google.com/macros/s/AKfycbwEoglQWQHuLI_SwP8nGWELMQ7wqD5JWJkKad0kRGcPMYBQ1B_O7fHiVNYR22ch8WbA/exec";
                    try {
                        await fetch(backupUrl, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                timestamp: new Date().toISOString(),
                                client: clientData.username,
                                username: clientData.username,
                                password: clientData.password,
                                phone: clientData.phone,
                                email: clientData.email,
                                domain_url: clientData.railwayUrl
                            })
                        });
                        console.log("Sandaran klien berjaya dihantar ke Google Drive pusat.");
                    } catch (error) {
                        console.error("Gagal menghantar sandaran klien:", error);
                    }
                },

                async backupChatToGoogleDrive(chatPhone, senderText, senderType) {
                    const backupChatUrl = "https://script.google.com/macros/s/AKfycbwEoglQWQHuLI_SwP8nGWELMQ7wqD5JWJkKad0kRGcPMYBQ1B_O7fHiVNYR22ch8WbA/exec";
                    const currentClient = this.currentUser ? this.currentUser.username : 'default';

                    try {
                        await fetch(backupChatUrl, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                timestamp: new Date().toISOString(),
                                client: currentClient,
                                phone: chatPhone,
                                sender: senderType,
                                message: senderText
                            })
                        });
                        console.log(`Auto-backup chat untuk klien [${currentClient}] berjaya dihantar.`);
                    } catch (error) {
                        console.error("Gagal menghantar auto-backup chat:", error);
                    }
                },

                getCurrentRailwayUrl() {
                    if (!this.currentUser) return null;
                    const client = this.clients.find(c => c.username === this.currentUser.username);
                    if (client && client.railwayUrl && client.railwayUrl.trim() !== '') {
                        return client.railwayUrl;
                    }
                    console.error("Ralat Keselamatan: Railway URL untuk klien ini tidak wujud atau kosong!");
                    return null;
                },

                async fetchLiveChats() {
                    const sheetsUrl = "https://script.google.com/macros/s/AKfycbwEoglQWQHuLI_SwP8nGWELMQ7wqD5JWJkKad0kRGcPMYBQ1B_O7fHiVNYR22ch8WbA/exec";
                    
                    try {
                        const response = await fetch(sheetsUrl);
                        const data = await response.json();
                        
                        if (data.status === "success" && data.data && data.data.length > 0) {
                            const chatMap = {};
                            const currentClient = this.currentUser ? this.currentUser.username.toLowerCase() : '';
                            
                            let matchedDataCount = 0;

                            data.data.forEach(row => {
                                // Tapis dengan ketat mengikut kolum client. Jika kolum client kosong (data lama), abaikan.
                                const rowClient = row.client ? row.client.toLowerCase().trim() : '';
                                
                                if (rowClient !== currentClient) {
                                    return;
                                }

                                matchedDataCount++;
                                const phone = row.phone || "Unknown";
                                if (!chatMap[phone]) {
                                    chatMap[phone] = {
                                        id: 'chat-' + phone.replace(/[^0-9]/g, ''),
                                        phone: phone,
                                        lastMessage: row.message || "",
                                        time: row.timestamp ? row.timestamp.substring(0, 16).replace('T', ' ') : "",
                                        mode: 'ai',
                                        messages: []
                                    };
                                }
                                
                                if (row.message) {
                                    chatMap[phone].messages.push({
                                        sender: row.sender || 'customer',
                                        text: row.message,
                                        time: row.timestamp ? row.timestamp.substring(11, 16) : ""
                                    });
                                    chatMap[phone].lastMessage = row.message;
                                    chatMap[phone].time = row.timestamp ? row.timestamp.substring(0, 16).replace('T', ' ') : "";
                                }
                            });
                            
                            if (matchedDataCount > 0) {
                                const formattedChats = Object.values(chatMap);
                                const currentActiveId = this.activeChat ? this.activeChat.id : null;
                                
                                this.liveChats = formattedChats;
                                if (currentActiveId) {
                                    this.activeChat = this.liveChats.find(c => c.id === currentActiveId) || this.activeChat;
                                }
                            } else {
                                this.liveChats = [];
                            }
                        } else {
                            this.liveChats = [];
                        }
                    } catch (error) {
                        console.error("Gagal menarik data dari Google Sheets:", error);
                        this.liveChats = [];
                    }
                },

                async updateBrainBotPrompt() {
                    if (this.brainPrompt.length > 2000) {
                        alert('Prompt melebihi had 2,000 aksara!');
                        return;
                    }
                    const baseUrl = this.getCurrentRailwayUrl();
                    if (!baseUrl) {
                        alert('Ralat Keselamatan: Domain Railway Bot untuk akaun anda tidak ditetapkan atau kosong. Sila hubungi Admin.');
                        return;
                    }
                    const username = this.currentUser ? this.currentUser.username : '';

                    try {
                        const response = await fetch(`${baseUrl}/api/${username}/prompt`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ prompt: this.brainPrompt })
                        });
                        const data = await response.json();
                        if(data.success) {
                            alert(`Prompt Brain Bot untuk akaun [${username}] berjaya dikemaskini ke server ${baseUrl}!`);
                        } else {
                            alert('Gagal mengemaskini prompt pada server.');
                        }
                    } catch (error) {
                        console.error('Ralat mengemaskini prompt:', error);
                        alert(`Tetapan prompt untuk ${username} disimpan.`);
                    }
                },

                async sendReplyMessage() {
                    if (!this.replyText.trim() || !this.activeChat) return;
                    
                    const replyMsg = this.replyText;
                    const phoneNum = this.activeChat.phone;

                    this.activeChat.messages.push({
                        sender: 'agent',
                        text: replyMsg,
                        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    });
                    this.activeChat.lastMessage = replyMsg;
                    this.replyText = '';

                    // Auto-backup mesej hantaran agen ke Google Drive pusat
                    await this.backupChatToGoogleDrive(phoneNum, replyMsg, 'agent');
                },

                async toggleChatMode(chatId) {
                    const chat = this.liveChats.find(c => c.id === chatId);
                    if (chat) {
                        chat.mode = chat.mode === 'ai' ? 'human' : 'ai';
                    }
                },

                loadClientProfileData() {
                    const c = this.clients.find(x => x.username === this.currentUser.username);
                    if (c) {
                        this.clientProfileForm = { 
                            username: c.username, 
                            phone: c.phone || '', 
                            email: c.email || '',
                            newPassword: ''
                        };
                    }
                },

                updateClientProfile() {
                    const clientIndex = this.clients.findIndex(x => x.username === this.currentUser.username);
                    if (clientIndex !== -1) {
                        this.clients[clientIndex].username = this.clientProfileForm.username;
                        
                        if (this.clientProfileForm.newPassword.trim() !== '') {
                            this.clients[clientIndex].password = this.clientProfileForm.newPassword;
                        }

                        this.currentUser.username = this.clientProfileForm.username;
                        localStorage.setItem('leea_current_user', JSON.stringify(this.currentUser));
                        
                        this.saveClientsToStorage();
                        this.clientProfileForm.newPassword = '';
                        alert('Profil dan tetapan berjaya dikemaskini!');
                    } else {
                         alert('Ralat mengemaskini profil.');
                    }
                },

                selectActiveChat(chat) {
                    this.activeChat = chat;
                },

                openClientModal(mode, index = null) {
                    this.modalMode = mode;
                    if (mode === 'edit' && index !== null) {
                        this.editIndex = index;
                        const c = this.clients[index];
                        this.clientForm = { username: c.username, password: c.password, phone: c.phone, email: c.email, railwayUrl: c.railwayUrl };
                    } else {
                        this.editIndex = null;
                        this.clientForm = { username: '', password: '', phone: '', email: '', railwayUrl: '' };
                    }
                    this.showClientModal = true;
                },

                async saveClient() {
                    if (!this.clientForm.railwayUrl || this.clientForm.railwayUrl.trim() === '') {
                        alert('Ralat: Domain Railway Bot URL wajib diisi untuk keselamatan akaun!');
                        return;
                    }

                    let clientDataToSave = {};

                    if (this.modalMode === 'edit' && this.editIndex !== null) {
                        this.clients[this.editIndex].username = this.clientForm.username;
                        this.clients[this.editIndex].password = this.clientForm.password;
                        this.clients[this.editIndex].phone = this.clientForm.phone;
                        this.clients[this.editIndex].email = this.clientForm.email;
                        this.clients[this.editIndex].railwayUrl = this.clientForm.railwayUrl;
                        
                        clientDataToSave = this.clients[this.editIndex];
                        alert('Maklumat klien berjaya dikemaskini!');
                    } else {
                        const nextIdNum = 1000 + this.clients.length + 1;
                        const newClientId = `CLI-${nextIdNum}`;

                        const newClient = {
                            clientId: newClientId,
                            username: this.clientForm.username,
                            password: this.clientForm.password,
                            phone: this.clientForm.phone,
                            email: this.clientForm.email,
                            railwayUrl: this.clientForm.railwayUrl,
                            status: 'Paid 🟢',
                            expiryDate: '27/09/2026'
                        };

                        this.clients.push(newClient);
                        clientDataToSave = newClient;
                        alert(`Klien berjaya didaftarkan dengan ID: ${newClientId}`);
                    }
                    
                    this.saveClientsToStorage();
                    await this.backupClientToGoogleDrive(clientDataToSave);

                    this.showClientModal = false;
                },

                toggleLang() {
                    this.lang = this.lang === 'ms' ? 'en' : 'ms';
                },

                login() {
                    this.loginError = '';
                    if (this.loginForm.username === 'admin' && this.loginForm.password === 'adminpassword123') {
                        this.currentUser = { username: 'admin', role: 'admin' };
                        this.isLoggedIn = true;
                        localStorage.setItem('leea_current_user', JSON.stringify(this.currentUser));
                    } else {
                        const found = this.clients.find(c => c.username === this.loginForm.username && c.password === this.loginForm.password);
                        if (found) {
                            this.currentUser = { username: found.username, clientId: found.clientId, role: 'client', status: found.status, expiryDate: found.expiryDate };
                            this.isLoggedIn = true;
                            localStorage.setItem('leea_current_user', JSON.stringify(this.currentUser));
                            
                            window.location.hash = found.clientId;

                            this.loadClientProfileData();
                            this.fetchLiveChats();
                        } else {
                            this.loginError = 'Nama pengguna atau kata laluan salah!';
                        }
                    }
                },

                logout() {
                    this.isLoggedIn = false;
                    this.currentUser = null;
                    this.liveChats = [];
                    this.activeChat = null;
                    localStorage.removeItem('leea_current_user');
                    window.location.hash = '';
                },

                getTotalChatCount() {
                    return this.liveChats.length;
                },

                getTodayChatCount() {
                    return this.liveChats.length; 
                },

                getMonthlyChatCount() {
                    return this.liveChats.length;
                },

                getAiHandledPercentage() {
                    if (this.liveChats.length === 0) return '0%';
                    let ai = this.liveChats.filter(c => c.mode === 'ai').length;
                    return Math.round((ai / this.liveChats.length) * 100) + '%';
                },

                getRemainingFreeQuota() {
                    let total = this.getTotalChatCount();
                    let rem = 1000 - total;
                    return rem >= 0 ? rem : 0;
                },

                calculateMetaCost() {
                    let totalChats = this.getTotalChatCount();
                    let paidChats = totalChats - 1000;
                    if (paidChats > 0) {
                        let cost = paidChats * 0.003;
                        return 'RM ' + cost.toFixed(3);
                    }
                    return 'RM 0.000';
                },

                approveRenewal(index) {
                    this.clients[index].status = 'Paid 🟢';
                    this.saveClientsToStorage();
                    alert('Langganan diluluskan!');
                },

                deleteClient(index) {
                    if(confirm('Padam akaun ini?')) {
                        this.clients.splice(index, 1);
                        this.saveClientsToStorage();
                    }
                }
            }
        }
    </script>
</body>
</html>
