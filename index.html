<!DOCTYPE html>
<html lang="ms" x-data="appData()" x-init="init()" :class="{ 'dark': darkMode }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEEA System - Portal Rasmi</title>
    <!-- Tailwind CSS & Alpine.js -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#059669',
                        darkBg: '#0f172a'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 dark:bg-darkBg text-gray-800 dark:text-gray-100 font-sans antialiased min-h-screen flex flex-col transition-colors duration-200">

    <!-- HEADER / NAVBAR -->
    <header class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <!-- Logo & Tajuk Atas -->
            </div>

            <!-- CONTROLS -->
            <div class="flex items-center space-x-4">
                <!-- Lang Toggle -->
                <button @click="toggleLang()" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 transition">
                    <span x-text="lang === 'ms' ? 'English (EN)' : 'Bahasa Melayu (BM)'"></span>
                </button>

                <!-- Dark Mode -->
                <button @click="darkMode = !darkMode" class="p-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg">
                    <i :class="darkMode ? 'fa-solid fa-sun' : 'fa-solid fa-moon'"></i>
                </button>

                <!-- User Session Indicator -->
                <template x-if="isLoggedIn">
                    <div class="flex items-center space-x-3 border-l pl-4 border-gray-200 dark:border-gray-700">
                        <div class="text-right">
                            <span class="block text-sm font-bold" x-text="currentUser.username"></span>
                            <span class="text-xs text-emerald-600 dark:text-emerald-400 capitalize" x-text="currentUser.role"></span>
                        </div>
                        <button @click="logout()" class="text-red-500 hover:text-red-700 p-2" title="Log Keluar">
                            <i class="fa-solid fa-right-from-bracket"></i>
                        </button>
                    </div>
                </template>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- 1. SKRIN LOGIN -->
        <template x-if="!isLoggedIn">
            <div class="max-w-md mx-auto space-y-4">
                <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl overflow-hidden border border-gray-200 dark:border-gray-700 mt-6">
                    <div class="p-8">
                        <div class="text-center mb-6">
                            <h2 class="text-2xl font-black uppercase tracking-wider text-gray-900 dark:text-white">SISTEM LEEA</h2>
                            <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Sistem Automasi AI Bot Untuk Whatsapp</p>
                        </div>

                        <form @submit.prevent="login()" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold uppercase text-gray-600 dark:text-gray-400 mb-1" x-text="lang === 'ms' ? 'Nama Pengguna' : 'Username'"></label>
                                <input type="text" x-model="loginForm.username" required class="w-full px-4 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-gray-600 dark:text-gray-400 mb-1" x-text="lang === 'ms' ? 'Kata Laluan' : 'Password'"></label>
                                <input type="password" x-model="loginForm.password" required class="w-full px-4 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                            </div>
                            <div class="text-red-500 text-xs" x-text="loginError"></div>
                            <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg transition shadow-lg" x-text="lang === 'ms' ? 'Log Masuk' : 'Sign In'"></button>
                        </form>
                    </div>
                </div>

                <!-- Live Support WhatsApp Button dengan Lampu Merah Kedip-Kedip -->
                <div class="text-center">
                    <a href="https://wa.link/mvtkdr" target="_blank" class="inline-flex items-center justify-center space-x-2 px-5 py-3 bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold rounded-xl shadow-md transition transform hover:-translate-y-0.5">
                        <span class="relative flex h-3 w-3">
                          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                          <span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
                        </span>
                        <i class="fa-brands fa-whatsapp text-sm text-green-300"></i>
                        <span x-text="lang === 'ms' ? 'Live Support WhatsApp' : 'WhatsApp Live Support'"></span>
                    </a>
                </div>
            </div>
        </template>

        <!-- 2. PORTAL KLIEN -->
        <template x-if="isLoggedIn && currentUser.role === 'client'">
            <div class="space-y-6">
                <!-- Welcome Banner -->
                <div class="bg-gradient-to-r from-emerald-600 to-teal-700 rounded-2xl p-6 text-white shadow-lg flex justify-between items-center">
                    <div>
                        <h1 class="text-2xl font-bold" x-text="(lang === 'ms' ? 'Selamat Datang, ' : 'Welcome, ') + currentUser.username"></h1>
                        <p class="text-emerald-100 text-sm mt-1" x-text="lang === 'ms' ? 'Status Langganan Aktif: Pakej Standard (RM130/bulan)' : 'Active Subscription: Standard Plan (RM130/month)'"></p>
                    </div>
                    <div class="bg-white/10 px-4 py-2 rounded-xl backdrop-blur-md text-right">
                        <span class="block text-xs text-emerald-200" x-text="lang === 'ms' ? 'Tarikh Luput' : 'Expiry Date'"></span>
                        <span class="font-bold text-sm" x-text="currentUser.expiryDate"></span>
                    </div>
                </div>

                <!-- Tabs Menu -->
                <div class="flex space-x-2 border-b border-gray-200 dark:border-gray-700 pb-2 overflow-x-auto">
                    <button @click="clientTab = 'dashboard'" :class="clientTab === 'dashboard' ? 'bg-emerald-600 text-white' : 'bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300'" class="px-4 py-2 rounded-lg font-medium text-sm transition shadow-sm whitespace-nowrap">
                        <i class="fa-solid fa-chart-line mr-2"></i> Dashboard & Analytics
                    </button>
                    <button @click="clientTab = 'livechat'" :class="clientTab === 'livechat' ? 'bg-emerald-600 text-white' : 'bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300'" class="px-4 py-2 rounded-lg font-medium text-sm transition shadow-sm whitespace-nowrap">
                        <i class="fa-solid fa-comments mr-2"></i> <span x-text="lang === 'ms' ? 'Live Chat & Kawalan Bot' : 'Live Chat & Bot Control'"></span>
                    </button>
                    <button @click="clientTab = 'billing'" :class="clientTab === 'billing' ? 'bg-emerald-600 text-white' : 'bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300'" class="px-4 py-2 rounded-lg font-medium text-sm transition shadow-sm whitespace-nowrap">
                        <i class="fa-solid fa-credit-card mr-2"></i> <span x-text="lang === 'ms' ? 'Langganan & Bil' : 'Subscription & Billing'"></span>
                    </button>
                </div>

                <!-- Tab Content: Dashboard -->
                <div x-show="clientTab === 'dashboard'" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700">
                            <span class="text-xs font-semibold text-gray-400 uppercase" x-text="lang === 'ms' ? 'Jumlah WhatsApp Chat' : 'Total WhatsApp Chats'"></span>
                            <h3 class="text-3xl font-extrabold mt-2 text-emerald-600">1,248</h3>
                            <span class="text-xs text-emerald-500 mt-1 block">↑ 12% dari bulan lalu</span>
                        </div>
                        <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700">
                            <span class="text-xs font-semibold text-gray-400 uppercase" x-text="lang === 'ms' ? 'AI Auto-Pilot Selesai' : 'AI Handled Chats'"></span>
                            <h3 class="text-3xl font-extrabold mt-2 text-blue-600">89%</h3>
                            <span class="text-xs text-gray-400 mt-1 block">Baki 11% diambil alih ejen</span>
                        </div>
                        <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700">
                            <span class="text-xs font-semibold text-gray-400 uppercase" x-text="lang === 'ms' ? 'Status Akaun' : 'Account Status'"></span>
                            <h3 class="text-2xl font-extrabold mt-2 text-emerald-600" x-text="currentUser.status"></h3>
                            <span class="text-xs text-gray-400 mt-1 block" x-text="(lang === 'ms' ? 'Auto-renew aktif' : 'Auto-renew active')"></span>
                        </div>
                    </div>

                    <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700">
                        <h3 class="text-lg font-bold mb-2 flex items-center">
                            <i class="fa-solid fa-calculator text-emerald-600 mr-2"></i> 
                            <span x-text="lang === 'ms' ? 'Anggaran Pengiraan Pembayaran Meta Chat (>10 Chat)' : 'Meta Chat Cost Estimation Calculator (>10 Chats)'"></span>
                        </h3>
                        <p class="text-xs text-gray-500 mb-4" x-text="lang === 'ms' ? 'Kira anggaran kos tambahan mesej WhatsApp Business API melebihi kuota asas.' : 'Calculate estimated extra costs for WhatsApp Business API messages beyond base quota.'"></p>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
                            <div>
                                <label class="block text-xs font-semibold uppercase text-gray-600 dark:text-gray-400 mb-2" x-text="lang === 'ms' ? 'Jumlah Chat Sebulan (Minimum 10)' : 'Total Chats Per Month (Min 10)'"></label>
                                <input type="number" min="10" x-model.number="metaChats" class="w-full px-4 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                            </div>
                            <div class="bg-emerald-50 dark:bg-emerald-900/20 p-4 rounded-xl border border-emerald-200 dark:border-emerald-800 text-center">
                                <span class="text-xs uppercase font-bold text-emerald-600 dark:text-emerald-400" x-text="lang === 'ms' ? 'Anggaran Kos Meta API' : 'Estimated Meta API Cost'"></span>
                                <div class="text-2xl font-black text-emerald-700 dark:text-emerald-300 mt-1" x-text="'RM ' + calculateMetaCost()"></div>
                                <span class="text-[10px] text-gray-500 mt-1 block" x-text="lang === 'ms' ? '*Kadar anggaran purata RM0.07 per sesi perbualan berniaga.' : '*Average estimated rate RM0.07 per conversation session.'"></span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tab Content: Live Chat & Bot Control -->
                <div x-show="clientTab === 'livechat'" class="space-y-6">
                    <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700">
                        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 pb-4 border-b dark:border-gray-700">
                            <div>
                                <h3 class="text-lg font-bold" x-text="lang === 'ms' ? 'Papan Pemantauan Live Chat & Suis Mod Bot' : 'Live Chat Monitoring & Bot Mode Switcher'"></h3>
                                <p class="text-xs text-gray-500 mt-1" x-text="lang === 'ms' ? 'Pantau perbualan pelanggan secara langsung dan tukar kawalan daripada AI kepada Ejen Manusia (Human Touch).' : 'Monitor customer conversations live and switch control from AI to Human Touch.'"></p>
                            </div>
                            <span class="mt-2 md:mt-0 px-3 py-1 bg-emerald-100 dark:bg-emerald-900 text-emerald-700 dark:text-emerald-300 rounded-full text-xs font-semibold animate-pulse">
                                <i class="fa-solid fa-circle text-[8px] mr-1"></i> Live Connected
                            </span>
                        </div>

                        <div class="space-y-4">
                            <template x-for="chat in liveChats" :key="chat.id">
                                <div class="p-4 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-700/30 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                    <div class="space-y-1">
                                        <div class="flex items-center space-x-2">
                                            <span class="font-bold text-sm" x-text="chat.customerName"></span>
                                            <span class="text-xs px-2 py-0.5 rounded bg-gray-200 dark:bg-gray-600" x-text="chat.phone"></span>
                                        </div>
                                        <p class="text-xs text-gray-600 dark:text-gray-300 italic" x-text="'\"' + chat.lastMessage + '\"'"></p>
                                        <span class="text-[10px] text-gray-400 block" x-text="'Masa: ' + chat.time"></span>
                                    </div>

                                    <div class="flex items-center space-x-3 w-full md:w-auto justify-between md:justify-end border-t md:border-t-0 pt-3 md:pt-0 border-gray-200 dark:border-gray-700">
                                        <div class="text-right">
                                            <span class="text-xs block font-semibold" x-text="chat.mode === 'ai' ? 'Mod AI Bot Aktif' : 'Mod Human Touch Aktif'"></span>
                                            <span class="text-[10px]" :class="chat.mode === 'ai' ? 'text-blue-500' : 'text-amber-500'" x-text="chat.mode === 'ai' ? 'Automatik dilayan AI' : 'Diambil alih Ejen Manusia'"></span>
                                        </div>
                                        <!-- Butang Lihat Mesej / View Chat -->
                                        <button @click="openViewChat(chat)" class="px-3 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-bold transition shadow">
                                            <i class="fa-solid fa-eye mr-1"></i> <span x-text="lang === 'ms' ? 'Lihat Mesej' : 'View Chat'"></span>
                                        </button>
                                        <!-- Butang Suis Mod -->
                                        <button @click="toggleChatMode(chat.id)" 
                                                class="px-3 py-2 rounded-lg text-xs font-bold text-white transition shadow"
                                                :class="chat.mode === 'ai' ? 'bg-amber-600 hover:bg-amber-700' : 'bg-emerald-600 hover:bg-emerald-700'">
                                            <i :class="chat.mode === 'ai' ? 'fa-solid fa-headset mr-1' : 'fa-solid fa-robot mr-1'"></i>
                                            <span x-text="chat.mode === 'ai' ? (lang === 'ms' ? 'Tukar ke Human' : 'Switch to Human') : (lang === 'ms' ? 'Tukar ke AI Bot' : 'Switch to AI Bot')"></span>
                                        </button>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- Tab Content: Billing & Subscription -->
                <div x-show="clientTab === 'billing'" class="space-y-6">
                    <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700">
                        <h3 class="text-lg font-bold mb-4" x-text="lang === 'ms' ? 'Maklumat Pelan Langganan Semasa' : 'Current Subscription Plan'"></h3>
                        
                        <div class="flex flex-col md:flex-row justify-between items-start md:items-center p-4 bg-gray-50 dark:bg-gray-700/50 rounded-xl border border-gray-200 dark:border-gray-600 mb-6">
                            <div>
                                <span class="bg-emerald-100 text-emerald-800 dark:bg-emerald-900 dark:text-emerald-200 text-xs font-bold px-2.5 py-1 rounded-full uppercase" x-text="lang === 'ms' ? 'Pakej Standard' : 'Standard Plan'"></span>
                                <h4 class="text-xl font-bold mt-2">LEEA WhatsApp Automation Standard</h4>
                                <p class="text-xs text-gray-500 mt-1" x-text="lang === 'ms' ? 'Akses penuh bot AI, integrasi tanpa had & sokongan keutamaan.' : 'Full AI bot access, unlimited integrations & priority support.'"></p>
                            </div>
                            <div class="mt-4 md:mt-0 text-right">
                                <span class="text-2xl font-black text-emerald-600">RM130</span>
                                <span class="text-xs text-gray-500 block" x-text="lang === 'ms' ? 'per bulan' : 'per month'"></span>
                            </div>
                        </div>

                        <div class="border-t pt-4 dark:border-gray-700 flex justify-between items-center">
                            <div>
                                <span class="text-sm font-semibold block" x-text="lang === 'ms' ? 'Pembaharuan Langganan Seterusnya' : 'Next Subscription Renewal'"></span>
                                <span class="text-xs text-gray-500" x-text="(lang === 'ms' ? 'Sila buat bayaran melalui ToyyibPay di bawah. Notifikasi callback akan dihantar ke e-mel pentadbir.' : 'Please make payment via ToyyibPay below. Callback notification will be sent to the administrator email.')"></span>
                            </div>
                            <button @click="openToyyibPay()" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg shadow-md transition flex items-center">
                                <i class="fa-solid fa-file-invoice-dollar mr-2"></i> <span x-text="lang === 'ms' ? 'Bayar & Renew Langganan (RM130)' : 'Pay & Renew Subscription (RM130)'"></span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <!-- 3. PORTAL ADMIN -->
        <template x-if="isLoggedIn && currentUser.role === 'admin'">
            <div class="space-y-6">
                <div class="bg-gradient-to-r from-slate-800 to-slate-900 rounded-2xl p-6 text-white shadow-lg flex justify-between items-center">
                    <div>
                        <h1 class="text-2xl font-bold" x-text="lang === 'ms' ? 'Dashboard Pentadbir (Admin)' : 'Administrator Dashboard'"></h1>
                        <p class="text-slate-300 text-sm mt-1" x-text="lang === 'ms' ? 'Urus akaun klien, status langganan dan pengesahan bayaran.' : 'Manage client accounts, subscription statuses, and payment verifications.'"></p>
                    </div>
                    <div class="bg-white/10 px-4 py-2 rounded-xl backdrop-blur-md text-right">
                        <span class="block text-xs text-slate-300" x-text="lang === 'ms' ? 'Jumlah Klien' : 'Total Clients'"></span>
                        <span class="font-bold text-lg" x-text="clients.length"></span>
                    </div>
                </div>

                <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden">
                    <div class="p-6 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center">
                        <h3 class="font-bold text-lg" x-text="lang === 'ms' ? 'Senarai Akaun Klien' : 'Client Accounts List'"></h3>
                        <button @click="openClientModal('add')" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-lg shadow transition">
                            <i class="fa-solid fa-user-plus mr-1"></i> <span x-text="lang === 'ms' ? 'Tambah Klien Baru' : 'Add New Client'"></span>
                        </button>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-50 dark:bg-gray-700/50 text-xs uppercase text-gray-500 font-semibold border-b dark:border-gray-700">
                                    <th class="p-4" x-text="lang === 'ms' ? 'Nama Syarikat / Pengguna' : 'Company / Username'"></th>
                                    <th class="p-4" x-text="lang === 'ms' ? 'No. Telefon & E-mel' : 'Phone & Email'"></th>
                                    <th class="p-4" x-text="lang === 'ms' ? 'Status' : 'Status'"></th>
                                    <th class="p-4" x-text="lang === 'ms' ? 'Tarikh Luput' : 'Expiry Date'"></th>
                                    <th class="p-4 text-center" x-text="lang === 'ms' ? 'Tindakan Pentadbir' : 'Admin Actions'"></th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-200 dark:divide-gray-700 text-sm">
                                <template x-for="(client, index) in clients" :key="index">
                                    <tr>
                                        <td class="p-4 font-bold" x-text="client.username"></td>
                                        <td class="p-4 text-xs">
                                            <div x-text="client.phone || '-'"></div>
                                            <div class="text-gray-400" x-text="client.email || '-'"></div>
                                        </td>
                                        <td class="p-4">
                                            <span class="px-2.5 py-1 text-xs font-bold rounded-full" 
                                                  :class="client.status.includes('Paid') ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900 dark:text-emerald-200' : 'bg-yellow-100 text-yellow-800 dark:bg-yellow-900 dark:text-yellow-200'"
                                                  x-text="client.status"></span>
                                        </td>
                                        <td class="p-4 text-xs" x-text="client.expiryDate"></td>
                                        <td class="p-4 text-center space-x-2">
                                            <button @click="approveRenewal(index)" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-700 text-white text-xs rounded shadow" title="Luluskan Pembayaran (+1 Bulan)">
                                                <i class="fa-solid fa-check"></i> <span x-text="lang === 'ms' ? 'Luluskan Renew' : 'Approve Renew'"></span>
                                            </button>
                                            <button @click="openClientModal('edit', index)" class="px-3 py-1 bg-blue-600 hover:bg-blue-700 text-white text-xs rounded shadow" title="Edit Profil">
                                                <i class="fa-solid fa-pen"></i>
                                            </button>
                                            <button @click="deleteClient(index)" class="px-3 py-1 bg-red-600 hover:bg-red-700 text-white text-xs rounded shadow" title="Padam Akaun">
                                                <i class="fa-solid fa-trash"></i>
                                            </button>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </template>

        <!-- MODAL TAMBAH / EDIT KLIEN (BORANG KHAS) -->
        <div x-show="showClientModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4" style="display: none;">
            <div class="bg-white dark:bg-gray-800 w-full max-w-md rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-700 overflow-hidden flex flex-col">
                <div class="p-4 border-b dark:border-gray-700 flex justify-between items-center bg-gray-50 dark:bg-gray-700/50">
                    <h3 class="font-bold text-base" x-text="modalMode === 'add' ? (lang === 'ms' ? 'Tambah Klien Baru' : 'Add New Client') : (lang === 'ms' ? 'Kemaskini Klien' : 'Update Client')"></h3>
                    <button @click="showClientModal = false" class="text-gray-400 hover:text-red-500 text-lg p-2">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <form @submit.prevent="saveClient()" class="p-6 space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-600 dark:text-gray-400 mb-1" x-text="lang === 'ms' ? 'Nama Syarikat / Username' : 'Company / Username'"></label>
                        <input type="text" x-model="clientForm.username" required class="w-full px-4 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-600 dark:text-gray-400 mb-1" x-text="lang === 'ms' ? 'Nombor Telefon' : 'Phone Number'"></label>
                        <input type="text" x-model="clientForm.phone" placeholder="+60123456789" class="w-full px-4 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-600 dark:text-gray-400 mb-1" x-text="lang === 'ms' ? 'Alamat E-mel' : 'Email Address'"></label>
                        <input type="email" x-model="clientForm.email" placeholder="client@example.com" class="w-full px-4 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                    <p class="text-[11px] text-amber-500 italic">* Kata laluan menggunakan set default sistem. Klien perlu tukar kata laluan semasa log masuk kali pertama.</p>
                    <div class="flex justify-end space-x-2 pt-2">
                        <button type="button" @click="showClientModal = false" class="px-4 py-2 bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 text-xs font-bold rounded-lg" x-text="lang === 'ms' ? 'Batal' : 'Cancel'"></button>
                        <button type="submit" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-lg shadow" x-text="lang === 'ms' ? 'Simpan' : 'Save'"></button>
                    </div>
                </form>
            </div>
        </div>

        <!-- MODAL VIEW CHAT -->
        <div x-show="showChatModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4" style="display: none;">
            <div class="bg-white dark:bg-gray-800 w-full max-w-lg rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-700 overflow-hidden flex flex-col max-h-[80vh]">
                <div class="p-4 border-b dark:border-gray-700 flex justify-between items-center bg-gray-50 dark:bg-gray-700/50">
                    <div>
                        <h3 class="font-bold text-base" x-text="activeChat ? activeChat.customerName : ''"></h3>
                        <span class="text-xs text-gray-500" x-text="activeChat ? activeChat.phone : ''"></span>
                    </div>
                    <button @click="showChatModal = false" class="text-gray-400 hover:text-red-500 text-lg p-2">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <div class="p-4 overflow-y-auto space-y-3 flex-grow bg-slate-50 dark:bg-gray-900/50">
                    <div class="text-center text-[10px] text-gray-400 my-2">— Sejarah Perbualan Live Chat —</div>
                    <template x-for="msg in (activeChat ? activeChat.messages : [])">
                        <div class="flex" :class="msg.sender === 'client' ? 'justify-end' : 'justify-start'">
                            <div class="max-w-[80%] rounded-2xl px-4 py-2 text-xs shadow-sm"
                                 :class="msg.sender === 'client' ? 'bg-emerald-600 text-white rounded-br-none' : 'bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-100 rounded-bl-none border dark:border-gray-600'">
                                <p x-text="msg.text"></p>
                                <span class="text-[9px] block text-right mt-1 opacity-70" x-text="msg.time"></span>
                            </div>
                        </div>
                    </template>
                </div>
                <div class="p-4 border-t dark:border-gray-700 bg-white dark:bg-gray-800 text-right">
                    <button @click="showChatModal = false" class="px-4 py-2 bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 text-xs font-bold rounded-lg" x-text="lang === 'ms' ? 'Tutup' : 'Close'"></button>
                </div>
            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="mt-auto py-6 border-t border-gray-200 dark:border-gray-800 text-center text-xs text-gray-500">
        &copy; 2026 LEEA SYSTEM. All Rights Reserved.
    </footer>

    <!-- SCRIPT ALPINEJS -->
    <script>
        function appData() {
            return {
                lang: 'ms',
                darkMode: false,
                isLoggedIn: false,
                clientTab: 'dashboard',
                metaChats: 15,
                loginForm: { username: '', password: '' },
                loginError: '',
                currentUser: null,
                clients: [],
                
                showChatModal: false,
                activeChat: null,

                // Pembolehubah untuk Borang Khas Klien
                showClientModal: false,
                modalMode: 'add',
                editIndex: null,
                clientForm: { username: '', phone: '', email: '' },
                
                liveChats: [
                    { 
                        id: 1, 
                        customerName: 'Ahmad bin Ali', 
                        phone: '+60123456789', 
                        lastMessage: 'Berapa harga pakej sebulan?', 
                        time: '11:02 AM', 
                        mode: 'ai',
                        messages: [
                            { sender: 'customer', text: 'Hi, selamat tengah hari.', time: '11:00 AM' },
                            { sender: 'client', text: 'Hi Ahmad, ada apa yang boleh saya bantu?', time: '11:01 AM' },
                            { sender: 'customer', text: 'Berapa harga pakej sebulan?', time: '11:02 AM' }
                        ]
                    },
                    { 
                        id: 2, 
                        customerName: 'Siti Nurhaliza', 
                        phone: '+60198765432', 
                        lastMessage: 'Saya nak minta tolong tukar alamat.', 
                        time: '10:45 AM', 
                        mode: 'human',
                        messages: [
                            { sender: 'customer', text: 'Hello admin', time: '10:40 AM' },
                            { sender: 'client', text: 'Ya Siti, silakan.', time: '10:42 AM' },
                            { sender: 'customer', text: 'Saya nak minta tolong tukar alamat.', time: '10:45 AM' }
                        ]
                    },
                    { 
                        id: 3, 
                        customerName: 'Ravi Kumar', 
                        phone: '+60171122334', 
                        lastMessage: 'Adakah bot ni support bahasa tamil?', 
                        time: '09:15 AM', 
                        mode: 'ai',
                        messages: [
                            { sender: 'customer', text: 'Vanakkam!', time: '09:14 AM' },
                            { sender: 'customer', text: 'Adakah bot ni support bahasa tamil?', time: '09:15 AM' }
                        ]
                    }
                ],

                init() {
                    this.fetchClientsFromBot();
                },

                async fetchClientsFromBot() {
                    this.clients = [
                        { username: 'aluzlia', phone: '+60123334455', email: 'aluzlia@gmail.com', plan: 'Standard (RM130/mo)', status: 'Paid 🟢', expiryDate: '27/09/2026' },
                        { username: 'sbleisure transport', phone: '+60198887766', email: 'sbleisure@gmail.com', plan: 'Standard (RM130/mo)', status: 'Paid 🟢', expiryDate: '27/10/2026' }
                    ];
                },

                openClientModal(mode, index = null) {
                    this.modalMode = mode;
                    if (mode === 'edit' && index !== null) {
                        this.editIndex = index;
                        const c = this.clients[index];
                        this.clientForm = { username: c.username, phone: c.phone || '', email: c.email || '' };
                    } else {
                        this.editIndex = null;
                        this.clientForm = { username: '', phone: '', email: '' };
                    }
                    this.showClientModal = true;
                },

                saveClient() {
                    if (this.modalMode === 'add') {
                        this.clients.push({
                            username: this.clientForm.username,
                            phone: this.clientForm.phone,
                            email: this.clientForm.email,
                            plan: 'Standard (RM130/mo)',
                            status: 'Paid 🟢',
                            expiryDate: '27/09/2026'
                        });
                    } else if (this.modalMode === 'edit' && this.editIndex !== null) {
                        this.clients[this.editIndex].username = this.clientForm.username;
                        this.clients[this.editIndex].phone = this.clientForm.phone;
                        this.clients[this.editIndex].email = this.clientForm.email;
                    }
                    this.showClientModal = false;
                },

                openViewChat(chat) {
                    this.activeChat = chat;
                    this.showChatModal = true;
                },

                toggleChatMode(chatId) {
                    const chat = this.liveChats.find(c => c.id === chatId);
                    if (chat) {
                        chat.mode = chat.mode === 'ai' ? 'human' : 'ai';
                        const statusMsg = chat.mode === 'human' 
                            ? (this.lang === 'ms' ? 'Mod ditukar ke Human Touch. Ejen mengambil alih perbualan.' : 'Switched to Human Touch.') 
                            : (this.lang === 'ms' ? 'Mod ditukar ke AI Bot. Bot kembali aktif.' : 'Switched to AI Bot.');
                        alert(statusMsg);
                    }
                },

                toggleLang() {
                    this.lang = this.lang === 'ms' ? 'en' : 'ms';
                },

                login() {
                    this.loginError = '';
                    if (this.loginForm.username === 'admin' && this.loginForm.password === 'adminpassword123') {
                        this.currentUser = { username: 'admin', role: 'admin' };
                        this.isLoggedIn = true;
                    } else {
                        const found = this.clients.find(c => c.username === this.loginForm.username);
                        if (found) {
                            this.currentUser = { username: found.username, role: 'client', status: found.status, expiryDate: found.expiryDate };
                            this.isLoggedIn = true;
                        } else {
                            this.loginError = this.lang === 'ms' ? 'Nama pengguna atau kata laluan salah!' : 'Invalid username or password!';
                        }
                    }
                },

                logout() {
                    this.isLoggedIn = false;
                    this.loginForm = { username: '', password: '' };
                    this.currentUser = null;
                },

                calculateMetaCost() {
                    if (this.metaChats < 10) return '0.00';
                    return (this.metaChats * 0.07).toFixed(2);
                },

                openToyyibPay() {
                    alert(this.lang === 'ms' ? 'Pautan ToyyibPay (RM130) dibuka. Sila selesaikan bayaran. Notifikasi callback akan dihantar kepada e-mel pentadbir.' : 'ToyyibPay payment gateway (RM130) opened. Please complete payment. Callback notification will be sent to admin email.');
                    if(this.currentUser) {
                        const c = this.clients.find(x => x.username === this.currentUser.username);
                        if(c) c.status = 'Pending 🟡';
                        this.currentUser.status = 'Pending 🟡';
                    }
                },

                approveRenewal(index) {
                    this.clients[index].status = 'Paid 🟢';
                    this.clients[index].expiryDate = '27/10/2026';
                    alert(this.lang === 'ms' ? 'Langganan berjaya diluluskan (+1 Bulan)!' : 'Subscription successfully approved (+1 Month)!');
                },

                deleteClient(index) {
                    if(confirm(this.lang === 'ms' ? 'Anda pasti ingin memadam akaun ini?' : 'Are you sure you want to delete this account?')) {
                        this.clients.splice(index, 1);
                    }
                }
            }
        }
    </script>
</body>
</html>
