<!DOCTYPE html>
<html lang="ms" x-data="appData()" x-init="init()" :class="{ 'dark': darkMode }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEEA System - Portal Rasmi</title>
    <!-- Tailwind CSS & Alpine.js -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#059669',
                        darkBg: '#0f172a'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 dark:bg-darkBg text-gray-800 dark:text-gray-100 font-sans antialiased min-h-screen flex flex-col transition-colors duration-200">

    <!-- HEADER / NAVBAR -->
    <header class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="font-black text-lg tracking-wider text-emerald-600 dark:text-emerald-400">LEEA SYSTEM</span>
            </div>

            <!-- CONTROLS -->
            <div class="flex items-center space-x-4">
                <button @click="toggleLang()" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 transition">
                    <span x-text="lang === 'ms' ? 'English (EN)' : 'Bahasa Melayu (BM)'"></span>
                </button>

                <button @click="darkMode = !darkMode" class="p-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg">
                    <i :class="darkMode ? 'fa-solid fa-sun' : 'fa-solid fa-moon'"></i>
                </button>

                <template x-if="isLoggedIn">
                    <div class="flex items-center space-x-3 border-l pl-4 border-gray-200 dark:border-gray-700">
                        <div class="text-right">
                            <span class="block text-sm font-bold" x-text="currentUser.username"></span>
                            <span class="text-xs text-emerald-600 dark:text-emerald-400 capitalize" x-text="currentUser.role"></span>
                        </div>
                        <button @click="logout()" class="text-red-500 hover:text-red-700 p-2" title="Log Keluar">
                            <i class="fa-solid fa-right-from-bracket"></i>
                        </button>
                    </div>
                </template>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- 1. SKRIN LOGIN -->
        <template x-if="!isLoggedIn">
            <div class="max-w-md mx-auto space-y-4">
                <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl overflow-hidden border border-gray-200 dark:border-gray-700 mt-6">
                    <div class="p-8">
                        <div class="text-center mb-6">
                            <h2 class="text-2xl font-black uppercase tracking-wider text-gray-900 dark:text-white">SISTEM LEEA</h2>
                            <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Sistem Automasi AI Bot Untuk Whatsapp</p>
                        </div>

                        <form @submit.prevent="login()" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold uppercase text-gray-600 dark:text-gray-400 mb-1" x-text="lang === 'ms' ? 'Nama Pengguna' : 'Username'"></label>
                                <input type="text" x-model="loginForm.username" required class="w-full px-4 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-gray-600 dark:text-gray-400 mb-1" x-text="lang === 'ms' ? 'Kata Laluan' : 'Password'"></label>
                                <input type="password" x-model="loginForm.password" required class="w-full px-4 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                            </div>
                            <div class="text-red-500 text-xs" x-text="loginError"></div>
                            <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg transition shadow-lg" x-text="lang === 'ms' ? 'Log Masuk' : 'Sign In'"></button>
                        </form>
                    </div>
                </div>

                <div class="text-center">
                    <a href="https://wa.link/mvtkdr" target="_blank" class="inline-flex items-center justify-center space-x-2 px-5 py-3 bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold rounded-xl shadow-md transition transform hover:-translate-y-0.5">
                        <span class="relative flex h-3 w-3">
                          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                          <span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
                        </span>
                        <i class="fa-brands fa-whatsapp text-sm text-green-300"></i>
                        <span x-text="lang === 'ms' ? 'Live Support WhatsApp' : 'WhatsApp Live Support'"></span>
                    </a>
                </div>
            </div>
        </template>

        <!-- 2. PORTAL KLIEN -->
        <template x-if="isLoggedIn && currentUser.role === 'client'">
            <div class="space-y-6">
                <div class="bg-gradient-to-r from-emerald-600 to-teal-700 rounded-2xl p-6 text-white shadow-lg flex justify-between items-center">
                    <div>
                        <h1 class="text-2xl font-bold" x-text="(lang === 'ms' ? 'Selamat Datang, ' : 'Welcome, ') + currentUser.username"></h1>
                        <p class="text-emerald-100 text-sm mt-1" x-text="lang === 'ms' ? 'Status Langganan Aktif: Pakej Standard (RM130/bulan)' : 'Active Subscription: Standard Plan (RM130/month)'"></p>
                    </div>
                    <div class="bg-white/10 px-4 py-2 rounded-xl backdrop-blur-md text-right">
                        <span class="block text-xs text-emerald-200" x-text="lang === 'ms' ? 'Tarikh Luput' : 'Expiry Date'"></span>
                        <span class="font-bold text-sm" x-text="currentUser.expiryDate"></span>
                    </div>
                </div>

                <!-- Tabs Menu -->
                <div class="flex space-x-2 border-b border-gray-200 dark:border-gray-700 pb-2 overflow-x-auto">
                    <button @click="clientTab = 'dashboard'" :class="clientTab === 'dashboard' ? 'bg-emerald-600 text-white' : 'bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300'" class="px-4 py-2 rounded-lg font-medium text-sm transition shadow-sm whitespace-nowrap">
                        <i class="fa-solid fa-chart-line mr-2"></i> Dashboard & Analytics
                    </button>
                    <button @click="clientTab = 'livechat'" :class="clientTab === 'livechat' ? 'bg-emerald-600 text-white' : 'bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300'" class="px-4 py-2 rounded-lg font-medium text-sm transition shadow-sm whitespace-nowrap">
                        <i class="fa-solid fa-comments mr-2"></i> <span x-text="lang === 'ms' ? 'Live Chat & Kawalan Bot' : 'Live Chat & Bot Control'"></span>
                    </button>
                    <button @click="clientTab = 'billing'" :class="clientTab === 'billing' ? 'bg-emerald-600 text-white' : 'bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300'" class="px-4 py-2 rounded-lg font-medium text-sm transition shadow-sm whitespace-nowrap">
                        <i class="fa-solid fa-credit-card mr-2"></i> <span x-text="lang === 'ms' ? 'Langganan & Bil' : 'Subscription & Billing'"></span>
                    </button>
                    <button @click="clientTab = 'profile'" :class="clientTab === 'profile' ? 'bg-emerald-600 text-white' : 'bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300'" class="px-4 py-2 rounded-lg font-medium text-sm transition shadow-sm whitespace-nowrap">
                        <i class="fa-solid fa-user-gear mr-2"></i> <span x-text="lang === 'ms' ? 'Profil & Tetapan' : 'Profile & Settings'"></span>
                    </button>
                </div>

                <!-- Tab Content: Dashboard (Mula dari 0 & Realtime) -->
                <div x-show="clientTab === 'dashboard'" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <!-- Jumlah WhatsApp Chat -->
                        <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700">
                            <span class="text-xs font-semibold text-gray-400 uppercase" x-text="lang === 'ms' ? 'Jumlah WhatsApp Chat' : 'Total WhatsApp Chats'"></span>
                            <h3 class="text-3xl font-extrabold mt-2 text-emerald-600" x-text="getTotalChatCount()"></h3>
                            <span class="text-xs text-gray-400 mt-1 block" x-text="lang === 'ms' ? 'Kira secara realtime' : 'Counted in realtime'"></span>
                        </div>
                        
                        <!-- AI Auto-Pilot Selesai -->
                        <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700">
                            <span class="text-xs font-semibold text-gray-400 uppercase" x-text="lang === 'ms' ? 'AI Auto-Pilot Selesai' : 'AI Handled Chats'"></span>
                            <h3 class="text-3xl font-extrabold mt-2 text-blue-600" x-text="getAiHandledPercentage()"></h3>
                            <span class="text-xs text-gray-400 mt-1 block" x-text="lang === 'ms' ? 'Nisbah mod AI aktif' : 'Active AI mode ratio'"></span>
                        </div>

                        <!-- Status Akaun -->
                        <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700">
                            <span class="text-xs font-semibold text-gray-400 uppercase" x-text="lang === 'ms' ? 'Status Akaun' : 'Account Status'"></span>
                            <h3 class="text-2xl font-extrabold mt-2 text-emerald-600" x-text="currentUser.status"></h3>
                            <span class="text-xs text-gray-400 mt-1 block" x-text="(lang === 'ms' ? 'Auto-renew aktif' : 'Auto-renew active')"></span>
                        </div>
                    </div>
                </div>

                <!-- Tab Content: Live Chat & Bot Control -->
                <div x-show="clientTab === 'livechat'" class="space-y-6">
                    
                    <!-- WIDGET KIRAAN KUOTA PERCUMA & KOS META + NOTA TELUS -->
                    <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 space-y-3">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-center">
                            <div class="flex items-center space-x-3">
                                <div class="p-3 bg-emerald-100 dark:bg-emerald-900/50 text-emerald-600 rounded-xl">
                                    <i class="fa-solid fa-ticket text-xl"></i>
                                </div>
                                <div>
                                    <span class="text-xs font-semibold uppercase text-gray-400" x-text="lang === 'ms' ? 'Baki Kuota Token Meta Percuma (Bulan Semasa)' : 'Remaining Free Meta Quota (Current Month)'"></span>
                                    <div class="text-xl font-black text-gray-900 dark:text-white">
                                        <span x-text="getRemainingFreeQuota()"></span> / 1,000 <span class="text-xs font-normal text-gray-500">chat</span>
                                    </div>
                                </div>
                            </div>
                            <div class="bg-emerald-50 dark:bg-emerald-900/20 p-3 rounded-xl border border-emerald-200 dark:border-emerald-800 flex justify-between items-center">
                                <div>
                                    <span class="text-[10px] uppercase font-bold text-emerald-600 dark:text-emerald-400" x-text="lang === 'ms' ? 'Anggaran Kos Berbayar Meta' : 'Estimated Paid Meta Cost'"></span>
                                    <div class="text-lg font-black text-emerald-700 dark:text-emerald-300" x-text="calculateMetaCost()"></div>
                                </div>
                                <span class="text-[10px] text-gray-400 text-right max-w-[150px]" x-text="lang === 'ms' ? 'Jalan selepas kuota percuma habis' : 'Active after free quota finishes'"></span>
                            </div>
                        </div>

                        <!-- NOTA PENERANGAN TIADA KOMISEN -->
                        <div class="text-[11px] text-gray-500 dark:text-gray-400 bg-gray-50 dark:bg-gray-700/50 p-2.5 rounded-xl border border-gray-100 dark:border-gray-700 flex items-start space-x-2">
                            <i class="fa-solid fa-circle-info text-emerald-600 dark:text-emerald-400 mt-0.5"></i>
                            <div>
                                <span class="font-bold text-gray-700 dark:text-gray-300" x-text="lang === 'ms' ? 'Nota Telus:' : 'Transparent Note:'"></span>
                                <span x-text="lang === 'ms' ? ' Yuran langganan bulanan anda adalah untuk sewa sistem bot dan khidmat pengaturcaraan kami sahaja. Token mesej WhatsApp diuruskan terus oleh Meta, dan kami tidak mengambil sebarang komisen.' : ' Your monthly subscription covers our bot system rental and programming services only. WhatsApp message tokens are handled directly by Meta, and we take zero commission.'"></span>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden">
                        
                        <div class="p-4 border-b dark:border-gray-700 flex justify-between items-center bg-gray-50 dark:bg-gray-700/50">
                            <div>
                                <h3 class="font-bold text-base" x-text="lang === 'ms' ? 'Pusat Kawalan Live Chat & Bot' : 'Live Chat & Bot Control Center'"></h3>
                                <p class="text-xs text-gray-500" x-text="lang === 'ms' ? 'Pilih kotak chat di sebelah kiri untuk mula membaca dan membalas mesej.' : 'Select a chat box on the left to start reading and replying.'"></p>
                            </div>
                            <span class="px-3 py-1 bg-emerald-100 dark:bg-emerald-900 text-emerald-700 dark:text-emerald-300 rounded-full text-xs font-semibold flex items-center">
                                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping mr-2"></span> Live Connected
                            </span>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-12 min-h-[500px]">
                            
                            <!-- Senarai Kotak Chat (Kiri) -->
                            <div class="md:col-span-5 border-r border-gray-200 dark:border-gray-700 overflow-y-auto max-h-[550px] divide-y divide-gray-100 dark:divide-gray-700">
                                <template x-for="chat in liveChats" :key="chat.id">
                                    <div @click="selectActiveChat(chat)" 
                                         class="p-4 cursor-pointer transition hover:bg-gray-50 dark:hover:bg-gray-700/50 flex flex-col space-y-1"
                                         :class="activeChat && activeChat.id === chat.id ? 'bg-emerald-50 dark:bg-emerald-900/20 border-l-4 border-emerald-600' : ''">
                                        
                                        <div class="flex justify-between items-center">
                                            <span class="font-bold text-sm text-gray-900 dark:text-white" x-text="chat.phone"></span>
                                            <span class="text-[10px] text-gray-400" x-text="chat.time"></span>
                                        </div>
                                        
                                        <div class="text-xs text-gray-500 dark:text-gray-400 truncate" x-text="chat.lastMessage"></div>
                                        
                                        <div class="flex justify-between items-center pt-1">
                                            <span class="text-[10px] px-2 py-0.5 rounded-full font-bold uppercase"
                                                  :class="chat.mode === 'ai' ? 'bg-blue-100 text-blue-700 dark:bg-blue-900 dark:text-blue-300' : 'bg-amber-100 text-amber-700 dark:bg-amber-900 dark:text-amber-300'"
                                                  x-text="chat.mode === 'ai' ? 'AI Bot' : 'Human Touch'"></span>
                                            <span class="text-[10px] text-gray-400" x-text="chat.id"></span>
                                        </div>
                                    </div>
                                </template>
                            </div>

                            <!-- Ruangan Chat & Kawalan (Kanan) -->
                            <div class="md:col-span-7 flex flex-col bg-slate-50/50 dark:bg-gray-900/30">
                                <template x-if="!activeChat">
                                    <div class="flex flex-col items-center justify-center flex-grow p-8 text-center text-gray-400">
                                        <i class="fa-solid fa-comments text-4xl mb-3 text-emerald-500/50"></i>
                                        <p class="text-sm font-semibold" x-text="lang === 'ms' ? 'Sila pilih mana-mana kotak chat di sebelah kiri.' : 'Please select a chat box on the left.'"></p>
                                    </div>
                                </template>

                                <template x-if="activeChat">
                                    <div class="flex flex-col h-full flex-grow">
                                        
                                        <div class="p-3 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center shadow-xs">
                                            <div>
                                                <h4 class="font-bold text-sm text-gray-900 dark:text-white" x-text="activeChat.phone"></h4>
                                            </div>

                                            <div class="flex items-center space-x-2">
                                                <span class="text-xs font-semibold" :class="activeChat.mode === 'ai' ? 'text-blue-600' : 'text-amber-600'" 
                                                      x-text="activeChat.mode === 'ai' ? 'Mod: AI Bot' : 'Mod: Human Touch'"></span>
                                                      
                                                <button @click="toggleChatMode(activeChat.id)" 
                                                        class="px-3 py-1.5 rounded-lg text-xs font-bold text-white transition shadow"
                                                        :class="activeChat.mode === 'ai' ? 'bg-amber-600 hover:bg-amber-700' : 'bg-emerald-600 hover:bg-emerald-700'">
                                                    <i :class="activeChat.mode === 'ai' ? 'fa-solid fa-headset mr-1' : 'fa-solid fa-robot mr-1'"></i>
                                                    <span x-text="activeChat.mode === 'ai' ? (lang === 'ms' ? 'Tukar ke Human' : 'Switch to Human') : (lang === 'ms' ? 'Tukar ke AI' : 'Switch to AI')"></span>
                                                </button>
                                            </div>
                                        </div>

                                        <!-- Chat History Stream -->
                                        <div class="p-4 overflow-y-auto space-y-3 flex-grow max-h-[380px]">
                                            <template x-for="msg in activeChat.messages">
                                                <div class="flex" :class="msg.sender === 'customer' ? 'justify-start' : 'justify-end'">
                                                    <div class="max-w-[80%] rounded-2xl px-4 py-2 text-xs shadow-sm"
                                                         :class="msg.sender === 'customer' ? 'bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-100 rounded-bl-none border dark:border-gray-600' : 'bg-emerald-600 text-white rounded-br-none'">
                                                        <p x-text="msg.text"></p>
                                                        <span class="text-[9px] block text-right mt-1 opacity-70" x-text="msg.time"></span>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>

                                        <!-- Kotak Mesej Input -->
                                        <div class="p-3 bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700">
                                            <form @submit.prevent="sendReplyMessage()" class="flex items-center space-x-2">
                                                <input type="text" x-model="replyText" 
                                                       :placeholder="activeChat.mode === 'human' ? 'Taip mesej balas sebagai ejen...' : 'Sila tukar ke Human Touch untuk mula menaip...'"
                                                       class="flex-grow px-4 py-2 border rounded-xl text-xs dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                                                
                                                <button type="submit" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-lg shadow transition flex items-center space-x-1">
                                                    <i class="fa-solid fa-paper-plane"></i>
                                                    <span x-text="lang === 'ms' ? 'Hantar' : 'Send'"></span>
                                                </button>
                                            </form>
                                        </div>

                                    </div>
                                </template>
                            </div>

                        </div>
                    </div>
                </div>

                <!-- Tab Content: Billing -->
                <div x-show="clientTab === 'billing'" class="space-y-6">
                    <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700">
                        <h3 class="text-lg font-bold mb-4" x-text="lang === 'ms' ? 'Maklumat Pelan Langganan Semasa' : 'Current Subscription Plan'"></h3>
                        
                        <div class="flex flex-col md:flex-row justify-between items-start md:items-center p-4 bg-gray-50 dark:bg-gray-700/50 rounded-xl border border-gray-200 dark:border-gray-600 mb-6">
                            <div>
                                <span class="bg-emerald-100 text-emerald-800 dark:bg-emerald-900 dark:text-emerald-200 text-xs font-bold px-2.5 py-1 rounded-full uppercase" x-text="lang === 'ms' ? 'Pakej Standard' : 'Standard Plan'"></span>
                                <h4 class="text-xl font-bold mt-2">LEEA WhatsApp Automation Standard</h4>
                                <p class="text-xs text-gray-500 mt-1" x-text="lang === 'ms' ? 'Akses penuh bot AI, integrasi tanpa had & sokongan keutamaan.' : 'Full AI bot access, unlimited integrations & priority support.'"></p>
                            </div>
                            <div class="mt-4 md:mt-0 text-right">
                                <span class="text-2xl font-black text-emerald-600">RM130</span>
                                <span class="text-xs text-gray-500 block" x-text="lang === 'ms' ? 'per bulan' : 'per month'"></span>
                            </div>
                        </div>

                        <div class="border-t pt-4 dark:border-gray-700 flex justify-between items-center">
                            <div>
                                <span class="text-sm font-semibold block" x-text="lang === 'ms' ? 'Pembaharuan Langganan Seterusnya' : 'Next Subscription Renewal'"></span>
                                <span class="text-xs text-gray-500" x-text="(lang === 'ms' ? 'Sila buat bayaran melalui ToyyibPay di bawah.' : 'Please make payment via ToyyibPay below.')"></span>
                            </div>
                            <a href="https://toyyibpay.com/Architech-Labs-starter-Plan" target="_blank" @click="markPending()" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg shadow-md transition flex items-center">
                                <i class="fa-solid fa-file-invoice-dollar mr-2"></i> <span x-text="lang === 'ms' ? 'Bayar & Renew Langganan (RM130)' : 'Pay & Renew Subscription (RM130)'"></span>
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Tab Content: Profil & Tetapan Klien -->
                <div x-show="clientTab === 'profile'" class="space-y-6">
                    <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700">
                        <h3 class="text-lg font-bold mb-1 flex items-center">
                            <i class="fa-solid fa-user-pen text-emerald-600 mr-2"></i> 
                            <span x-text="lang === 'ms' ? 'Kemaskini Profil & Tetapan Akaun' : 'Update Profile & Account Settings'"></span>
                        </h3>
                        <p class="text-xs text-gray-500 mb-6" x-text="lang === 'ms' ? 'Urus maklumat peribadi, nombor telefon, e-mel serta tukar kata laluan akaun anda di sini.' : 'Manage personal info, phone number, email and change your account password here.'"></p>
                        
                        <form @submit.prevent="updateClientProfile()" class="space-y-4 max-w-xl">
                            <div>
                                <label class="block text-xs font-semibold uppercase text-gray-600 dark:text-gray-400 mb-1" x-text="lang === 'ms' ? 'Nama Syarikat / Username' : 'Company / Username'"></label>
                                <input type="text" x-model="clientProfileForm.username" required class="w-full px-4 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-semibold uppercase text-gray-600 dark:text-gray-400 mb-1" x-text="lang === 'ms' ? 'Nombor Telefon' : 'Phone Number'"></label>
                                    <input type="text" x-model="clientProfileForm.phone" placeholder="+60123334455" class="w-full px-4 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                                </div>
                                <div>

                    </div>

                                                  :class="client.status.includes('Paid') ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900 dark:text-emerald-200' : 'bg-yellow-100 text-yellow-800 dark:bg-yellow-900 dark:text-yellow-200'"

                                                <i class="fa-solid fa-check"></i> <span x-text="lang === 'ms' ? 'Luluskan Renew' : 'Approve Renew'"></span>

                                            <button @click="openClientModal('edit', index)" class="px-3 py-1 bg-blue-600 hover:bg-blue-700 text-white text-xs rounded shadow" title="Edit Profil">

        <!-- MODAL KLIEN (ADMIN) -->
        <div x-show="showClientModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4" style="display: none;">

                    <h3 class="font-bold text-base" x-text="modalMode === 'add' ? (lang === 'ms' ? 'Tambah Klien Baru' : 'Add New Client') : (lang === 'ms' ? 'Kemaskini Klien' : 'Update Client')"></h3>

                <form @submit.prevent="saveClient()" class="p-6 space-y-4">

                        <input type="text" x-model="clientForm.username" required class="w-full px-4 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-emerald-500 focus:outline-none">

                        <input type="text" x-model="clientForm.phone" placeholder="+60123456789" class="w-full px-4 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>

                        <input type="email" x-model="clientForm.email" placeholder="client@example.com" class="w-full px-4 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-600 dark:text-gray-400 mb-1" x-text="lang === 'ms' ? 'Domain Railway Bot (URL Admin)' : 'Railway Bot Domain (Admin URL)'"></label>
                        <input type="text" x-model="clientForm.railwayUrl" placeholder="https://web-production-xxxx.up.railway.app" class="w-full px-4 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                    <div class="flex justify-end space-x-2 pt-2">
                        <button type="button" @click="showClientModal = false" class="px-4 py-2 bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 text-xs font-bold rounded-lg" x-text="lang === 'ms' ? 'Batal' : 'Cancel'"></button>
                        <button type="submit" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-lg shadow" x-text="lang === 'ms' ? 'Simpan' : 'Save'"></button>

    <!-- SCRIPT ALPINEJS & API INTEGRATION -->
    <script>
        function appData() {
            return {
                lang: 'ms',
                darkMode: false,
                isLoggedIn: false,
                clientTab: 'dashboard',
                loginForm: { username: '', password: '' },
                loginError: '',
                currentUser: null,
                clients: [],
                
                activeChat: null,
                replyText: '',

                showClientModal: false,
                modalMode: 'add',
                editIndex: null,
                clientForm: { username: '', phone: '', email: '', railwayUrl: '' },
                
                clientProfileForm: {
                    username: '',
                    phone: '',
                    email: '',
                    newPassword: '',
                    confirmPassword: ''
                },
                
                liveChats: [],

                init() {
                    this.fetchClientsFromBot();
                    setInterval(() => {
                        if (this.isLoggedIn && this.currentUser && this.currentUser.role === 'client') {
                            this.fetchLiveChats();
                        }
                    }, 5000);
                },

                getCurrentRailwayUrl() {
                    const defaultUrl = 'https://web-production-07b92.up.railway.app';
                    if (!this.currentUser) return defaultUrl;
                    const client = this.clients.find(c => c.username === this.currentUser.username);
                    return (client && client.railwayUrl) ? client.railwayUrl : defaultUrl;
                },

                async fetchLiveChats() {
                    const baseUrl = this.getCurrentRailwayUrl();
                    if (!baseUrl) return;

                    try {
                        const response = await fetch(`${baseUrl}/api/chats`);
                        const data = await response.json();
                        if (data.success) {
                            const currentActiveId = this.activeChat ? this.activeChat.id : null;
                            this.liveChats = data.chats;
                            if (currentActiveId) {
                                this.activeChat = this.liveChats.find(c => c.id === currentActiveId) || this.activeChat;
                            }
                        }
                    } catch (error) {
                        console.error("Gagal menarik data live chats dari server:", error);
                    }
                },

                async sendReplyMessage() {
                    if (!this.replyText.trim() || !this.activeChat) return;
                    
                    const baseUrl = this.getCurrentRailwayUrl();
                    const textToSend = this.replyText;
                    const chatId = this.activeChat.id;
                    const customerPhone = this.activeChat.phone;

                    try {
                        const response = await fetch(`${baseUrl}/api/chats/reply`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                chat_id: chatId,
                                phone: customerPhone,
                                text: textToSend
                            })
                        });
                        const data = await response.json();
                        if (data.success) {
                            this.replyText = '';
                            this.fetchLiveChats();
                        }
                    } catch (error) {
                        console.error("Ralat menghantar mesej balasan:", error);
                    }
                },

                async toggleChatMode(chatId) {
                    const baseUrl = this.getCurrentRailwayUrl();
                    try {
                        const response = await fetch(`${baseUrl}/api/chats/toggle-mode`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ chat_id: chatId })
                        });
                        const data = await response.json();
                        if (data.success) {
                            this.fetchLiveChats();
                        }
                    } catch (error) {
                        console.error("Ralat menukar mod bot:", error);
                    }
                },

                async fetchClientsFromBot() {
                    this.clients = [
                        { username: 'aluzlia', phone: '+60123334455', email: 'aluzlia@gmail.com', railwayUrl: '', plan: 'Standard (RM130/mo)', status: 'Paid 🟢', expiryDate: '27/09/2026' },
                        { username: 'sbltransport', phone: '+60132434200', email: 'sbltransport.my@gmail.com', railwayUrl: 'https://web-production-07b92.up.railway.app', plan: 'Standard (RM130/mo)', status: 'Paid 🟢', expiryDate: '27/10/2026' }
                    ];
                },

                loadClientProfileData() {
                    const c = this.clients.find(x => x.username === this.currentUser.username);
                    if (c) {
                        this.clientProfileForm = {
                            username: c.username,
                            phone: c.phone || '',
                            email: c.email || '',
                            newPassword: '',
                            confirmPassword: ''
                        };
                    }
                },

                updateClientProfile() {
                    const index = this.clients.findIndex(x => x.username === this.currentUser.username);
                    if (index !== -1) {
                        this.clients[index].username = this.clientProfileForm.username;
                        this.clients[index].phone = this.clientProfileForm.phone;
                        this.clients[index].email = this.clientProfileForm.email;
                        this.currentUser.username = this.clientProfileForm.username;
                    }

                    alert(this.lang === 'ms' ? 'Profil dan tetapan akaun berjaya dikemaskini!' : 'Profile and account settings successfully updated!');
                },

                selectActiveChat(chat) {
                    this.activeChat = chat;
                },

                openClientModal(mode, index = null) {
                    this.modalMode = mode;
                    if (mode === 'edit' && index !== null) {
                        this.editIndex = index;
                        const c = this.clients[index];
                        this.clientForm = { username: c.username, phone: c.phone || '', email: c.email || '', railwayUrl: c.railwayUrl || '' };
                    } else {
                        this.editIndex = null;
                        this.clientForm = { username: '', phone: '', email: '', railwayUrl: '' };
                    }
                    this.showClientModal = true;
                },

                saveClient() {
                    if (this.modalMode === 'add') {
                        this.clients.push({
                            username: this.clientForm.username,
                            phone: this.clientForm.phone,
                            email: this.clientForm.email,
                            railwayUrl: this.clientForm.railwayUrl,
                            plan: 'Standard (RM130/mo)',
                            status: 'Paid 🟢',
                            expiryDate: '27/09/2026'
                        });
                    } else if (this.modalMode === 'edit' && this.editIndex !== null) {
                        this.clients[this.editIndex].username = this.clientForm.username;
                        this.clients[this.editIndex].phone = this.clientForm.phone;
                        this.clients[this.editIndex].email = this.clientForm.email;
                        this.clients[this.editIndex].railwayUrl = this.clientForm.railwayUrl;
                    }
                    this.showClientModal = false;
                },

                toggleLang() {
                    this.lang = this.lang === 'ms' ? 'en' : 'ms';
                },

                login() {
                    this.loginError = '';
                    if (this.loginForm.username === 'admin' && this.loginForm.password === 'adminpassword123') {
                        this.currentUser = { username: 'admin', role: 'admin' };
                        this.isLoggedIn = true;
                    } else {
                        const found = this.clients.find(c => c.username === this.loginForm.username);
                        if (found) {
                            this.currentUser = { username: found.username, role: 'client', status: found.status, expiryDate: found.expiryDate };
                            this.isLoggedIn = true;
                            this.loadClientProfileData();
                            this.fetchLiveChats();
                        } else {
                            this.loginError = this.lang === 'ms' ? 'Nama pengguna atau kata laluan salah!' : 'Invalid username or password!';
                        }
                    }
                },

                logout() {
                    this.isLoggedIn = false;
                    this.loginForm = { username: '', password: '' };
                    this.currentUser = null;
                    this.liveChats = [];
                    this.activeChat = null;
                },

                getTotalChatCount() {
                    let totalMessages = 0;
                    this.liveChats.forEach(chat => {
                        if (chat.messages && chat.messages.length) {
                            totalMessages += chat.messages.length;
                        }
                    });
                    return totalMessages; // Bermula dari 0
                },

                getAiHandledPercentage() {
                    if (this.liveChats.length === 0) return '0%';
                    let aiCount = 0;
                    this.liveChats.forEach(chat => {
                        if (chat.mode === 'ai') aiCount++;
                    });
                    let percentage = Math.round((aiCount / this.liveChats.length) * 100);
                    return percentage + '%'; // Bermula dari 0%
                },

                getRemainingFreeQuota() {
                    let total = this.getTotalChatCount();
                    let monthlyTotal = total > 1000 ? total % 1000 : total;
                    let remaining = 1000 - monthlyTotal;
                    return remaining >= 0 ? remaining : 0;
                },

                calculateMetaCost() {
                    let total = this.getTotalChatCount();
                    let paidChats = total - 1000;
                    if (paidChats <= 0) {
                        return 'RM 0.00 (Dalam Kuota Percuma)';
                    }
                    return 'RM ' + (paidChats * 0.07).toFixed(2);
                },

                markPending() {
                    if(this.currentUser) {
                        const c = this.clients.find(x => x.username === this.currentUser.username);
                        if(c) c.status = 'Pending 🟡';
                        this.currentUser.status = 'Pending 🟡';
                    }
                },

                approveRenewal(index) {
                    this.clients[index].status = 'Paid 🟢';
                    this.expiryDate = '27/10/2026';
                    alert(this.lang === 'ms' ? 'Langganan berjaya diluluskan (+1 Bulan)!' : 'Subscription successfully approved (+1 Month)!');
                },

                deleteClient(index) {
                    if(confirm(this.lang === 'ms' ? 'Anda pasti ingin memadam akaun ini?' : 'Are you sure you want to delete this account?')) {
                        this.clients.splice(index, 1);
                    }
                }
            }
        }
    </script>
