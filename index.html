<!DOCTYPE html>
<html lang="ms" x-data="appData()" x-init="init()" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEEA System - AI Digital Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#1d4ed8',
                        darkBg: '#030712',
                        cardDark: '#0f172a',
                        cyberBlue: '#60a5fa'
                    }
                }
            }
        }
    </script>
    <style>
        .ai-digital-bg {
            background: radial-gradient(circle at 50% 0%, #1e3a8a 0%, #0f172a 50%, #030712 100%);
            position: relative;
            overflow: hidden;
        }
        .ai-digital-bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(59, 130, 246, 0.05) 1px, transparent 1px), 
                              linear-gradient(90deg, rgba(59, 130, 246, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
        }
        .glow-effect {
            box-shadow: 0 0 25px -5px rgba(59, 130, 246, 0.3);
        }
        .cyber-border {
            border: 1px solid rgba(59, 130, 246, 0.2);
        }
        @keyframes pulse-red {
            0% { transform: scale(0.95); opacity: 0.9; box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); opacity: 0.9; box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .blinking-red-dot {
            animation: pulse-red 1.5s infinite;
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 font-sans antialiased min-h-screen flex flex-col">

    <header class="bg-gray-900/80 backdrop-blur-md border-b border-blue-500/20 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center glow-effect">
                    <i class="fa-solid fa-microchip text-white text-sm"></i>
                </div>
                <span class="font-black text-lg tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-300">LEEA AI SYSTEM</span>
            </div>

            <template x-if="isLoggedIn">
                <div class="flex items-center space-x-4 font-mono text-xs">
                    <!-- KOTAK DOMPET E-WALLET -->
                    <div @click="clientTab = 'affiliate'" class="flex items-center space-x-2 px-3 py-1.5 bg-gray-950 border border-emerald-500/40 rounded-xl cursor-pointer hover:bg-emerald-950/20 transition shadow" title="Klik untuk lihat E-Wallet Affiliate">
                        <i class="fa-solid fa-wallet text-emerald-400"></i>
                        <div>
                            <span class="text-[9px] text-gray-400 block uppercase leading-none">E-Wallet</span>
                            <span class="font-bold text-emerald-400 text-xs" x-text="'RM ' + affiliateData.walletBalance.toFixed(2)"></span>
                        </div>
                    </div>

                    <button @click="showInboxModal = true" class="relative p-2 rounded-xl bg-gray-800/60 hover:bg-gray-800 text-blue-300 transition" title="Message Inbox">
                        <i class="fa-solid fa-bell text-sm"></i>
                        <span class="absolute top-1 right-1 w-2.5 h-2.5 bg-red-500 rounded-full blinking-red-dot" x-show="hasUnreadMessages"></span>
                    </button>

                    <div class="flex items-center space-x-2 border-l pl-4 border-gray-800">
                        <template x-if="clientProfile.logoUrl">
                            <img :src="clientProfile.logoUrl" alt="Logo" class="w-7 h-7 rounded-lg object-cover border border-blue-500/40">
                        </template>
                        <div class="text-right">
                            <span class="block font-bold text-blue-300" x-text="currentUser.username"></span>
                            <span class="text-[10px] text-indigo-400 uppercase" x-text="'CLIENT (' + currentUser.clientId + ')'"></span>
                        </div>
                    </div>
                    <button @click="logout()" class="text-red-400 hover:text-red-300 p-2 transition" title="Log Keluar">
                        <i class="fa-solid fa-power-off"></i>
                    </button>
                </div>
            </template>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col justify-center space-y-6">

        <!-- Skrin Login Klien -->
        <template x-if="!isLoggedIn">
            <div class="max-w-md mx-auto space-y-6 w-full">
                <div class="ai-digital-bg rounded-3xl p-6 md:p-8 text-white shadow-2xl glow-effect cyber-border backdrop-blur-md">
                    <div class="text-center space-y-1 mb-6">
                        <h2 class="text-2xl font-black tracking-wider uppercase text-transparent bg-clip-text bg-gradient-to-r from-blue-300 via-white to-indigo-400">
                            Neural Authentication
                        </h2>
                        <p class="text-xs text-gray-400 font-mono">Portal Klien AI Automasi Bot</p>
                    </div>

                    <form @submit.prevent="login()" class="space-y-4 font-mono text-xs">
                        <div>
                            <label class="block uppercase text-blue-400 mb-1">Username Klien</label>
                            <input type="text" x-model="loginForm.username" required class="w-full px-4 py-2.5 bg-gray-950 border border-gray-800 rounded-xl text-blue-100 focus:outline-none">
                        </div>
                        <div>
                            <label class="block uppercase text-blue-400 mb-1">Password</label>
                            <div class="relative">
                                <input :type="showPassword ? 'text' : 'password'" x-model="loginForm.password" required class="w-full px-4 py-2.5 pr-10 bg-gray-950 border border-gray-800 rounded-xl text-blue-100 focus:outline-none">
                                <button type="button" @click="showPassword = !showPassword" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-blue-300 focus:outline-none">
                                    <i :class="showPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'"></i>
                                </button>
                            </div>
                        </div>
                        <div class="text-red-400" x-text="loginError"></div>
                        <button type="submit" class="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold rounded-xl shadow-lg glow-effect">AKSES PORTAL</button>
                    </form>
                </div>
            </div>
        </template>

        <!-- Papan Pemuka Klien -->
        <template x-if="isLoggedIn">
            <div class="space-y-6">
                <!-- Bar Utama Selamat Datang & Profil Bot -->
                <div class="bg-gradient-to-r from-blue-900/50 via-indigo-900/40 to-gray-900 rounded-2xl p-6 text-white cyber-border glow-effect flex flex-col md:flex-row justify-between items-start md:items-center font-mono gap-4">
                    <div class="flex items-center space-x-4">
                        <template x-if="clientProfile.logoUrl">
                            <img :src="clientProfile.logoUrl" alt="Logo Syarikat" class="w-14 h-14 rounded-2xl object-cover border-2 border-blue-500/40 glow-effect">
                        </template>
                        <template x-if="!clientProfile.logoUrl">
                            <div class="w-14 h-14 rounded-2xl bg-blue-600/20 border-2 border-blue-500/40 flex items-center justify-center text-blue-400">
                                <i class="fa-solid fa-robot text-2xl"></i>
                            </div>
                        </template>
                        <div>
                            <div class="flex items-center space-x-2 flex-wrap gap-1">
                                <h1 class="text-2xl font-black text-white" x-text="'Selamat Datang, ' + currentUser.username"></h1>
                                <span class="px-2.5 py-0.5 bg-blue-500/20 text-blue-300 border border-blue-500/30 rounded-full text-[10px] font-bold" x-text="clientBot.botName"></span>
                                <span class="px-2.5 py-0.5 bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 rounded-full text-[10px] uppercase font-bold" x-text="clientBot.planTier"></span>
                                
                                <button @click="handleBotUpgrade()" class="ml-2 px-3 py-1 bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-400 hover:to-orange-500 text-white text-[10px] font-bold rounded-full shadow transition flex items-center space-x-1">
                                    <i class="fa-solid fa-arrow-up-right-dots"></i>
                                    <span>Upgrade Bot</span>
                                </button>
                            </div>
                            <p class="text-indigo-300 text-xs mt-1" x-text="'ID Klien: ' + currentUser.clientId + ' | Tarikh Luput: ' + currentUser.expiryDate"></p>
                        </div>
                    </div>
                    <div class="bg-gray-950/80 px-4 py-2.5 rounded-xl cyber-border text-right text-xs">
                        <span class="block text-[10px] text-gray-400 uppercase">Log Masuk Terakhir:</span>
                        <span class="text-emerald-400 font-bold" x-text="currentUser.lastLogin || 'Pertama Kali Akses'"></span>
                    </div>
                </div>

                <!-- Tab Navigasi Klien -->
                <div class="flex space-x-2 border-b border-gray-800 pb-2 overflow-x-auto font-mono text-xs">
                    <button @click="clientTab = 'dashboard'" :class="clientTab === 'dashboard' ? 'bg-blue-600 text-white' : 'bg-gray-900 text-gray-400'" class="px-4 py-2 rounded-xl transition whitespace-nowrap">
                        <i class="fa-solid fa-chart-line mr-2"></i> Analytics & Neural
                    </button>
                    <button @click="clientTab = 'livechat'" :class="clientTab === 'livechat' ? 'bg-blue-600 text-white' : 'bg-gray-900 text-gray-400'" class="px-4 py-2 rounded-xl transition whitespace-nowrap">
                        <i class="fa-solid fa-comments mr-2"></i> Live Chat & Bot Control
                    </button>
                    <button @click="clientTab = 'brainbot'" :class="clientTab === 'brainbot' ? 'bg-blue-600 text-white' : 'bg-gray-900 text-gray-400'" class="px-4 py-2 rounded-xl transition whitespace-nowrap">
                        <i class="fa-solid fa-brain mr-2"></i> Tetapan Brain Bot
                    </button>
                    <button @click="clientTab = 'affiliate'" :class="clientTab === 'affiliate' ? 'bg-blue-600 text-white' : 'bg-gray-900 text-gray-400'" class="px-4 py-2 rounded-xl transition whitespace-nowrap">
                        <i class="fa-solid fa-handshake-angle mr-2"></i> Affiliate & E-Wallet
                    </button>
                    <button @click="clientTab = 'billing'" :class="clientTab === 'billing' ? 'bg-blue-600 text-white' : 'bg-gray-900 text-gray-400'" class="px-4 py-2 rounded-xl transition whitespace-nowrap">
                        <i class="fa-solid fa-credit-card mr-2"></i> Langganan & Bil
                    </button>
                    <button @click="clientTab = 'profile'" :class="clientTab === 'profile' ? 'bg-blue-600 text-white' : 'bg-gray-900 text-gray-400'" class="px-4 py-2 rounded-xl transition whitespace-nowrap">
                        <i class="fa-solid fa-user-gear mr-2"></i> Profil & Tetapan
                    </button>
                </div>

                <!-- Tab Dashboard / Analytics -->
                <div x-show="clientTab === 'dashboard'" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 font-mono">
                        <div class="bg-gray-900 p-6 rounded-2xl cyber-border">
                            <span class="text-xs text-gray-400 uppercase">Jumlah WhatsApp Chat</span>
                            <h3 class="text-3xl font-black mt-2 text-blue-400" x-text="liveChats.length">0</h3>
                        </div>
                        <div class="bg-gray-900 p-6 rounded-2xl cyber-border">
                            <span class="text-xs text-gray-400 uppercase">Status Akaun</span>
                            <h3 class="text-xl font-black mt-2 text-emerald-400" x-text="currentUser.status"></h3>
                        </div>
                        <div class="bg-gray-900 p-6 rounded-2xl cyber-border">
                            <span class="text-xs text-gray-400 uppercase">Pelayan Node</span>
                            <h3 class="text-xl font-black mt-2 text-blue-300">Active 🟢</h3>
                        </div>
                        <div class="bg-gray-900 p-6 rounded-2xl cyber-border">
                            <span class="text-xs text-gray-400 uppercase">Tarikh Luput</span>
                            <h3 class="text-xl font-black mt-2 text-indigo-400" x-text="currentUser.expiryDate"></h3>
                        </div>
                    </div>

                    <!-- Statistik Kuota Chat & Token -->
                    <div class="bg-gray-900 p-6 rounded-2xl cyber-border space-y-4 font-mono">
                        <div class="flex justify-between items-center">
                            <div class="flex items-center space-x-2">
                                <i class="fa-solid fa-comments-dollar text-emerald-400"></i>
                                <h3 class="font-bold text-sm text-emerald-300 uppercase">Statistik Kuota Chat & Token Semasa</h3>
                            </div>
                            <span class="text-xs font-bold px-3 py-1 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-full" x-text="(clientBot.tokenBalance || 1000) + ' / 1000 Baki Chat'"></span>
                        </div>

                        <div class="w-full bg-gray-950 rounded-full h-3.5 p-0.5 border border-gray-800">
                            <div class="h-2.5 bg-gradient-to-r from-emerald-500 to-blue-500 rounded-full transition-all duration-500" :style="'width: ' + Math.min(((clientBot.tokenBalance || 1000) / 1000) * 100, 100) + '%'"></div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 pt-2 text-[11px]">
                            <div class="bg-gray-950 p-3 rounded-xl cyber-border space-y-1">
                                <span class="text-gray-400 block uppercase">Kuota Percuma Asas</span>
                                <span class="font-bold text-blue-300 text-sm">1,000 Chat</span>
                                <p class="text-[10px] text-gray-500">Peruntukan mesej automatik AI bulanan.</p>
                            </div>
                            <div class="bg-gray-950 p-3 rounded-xl cyber-border space-y-1">
                                <span class="text-gray-400 block uppercase">Chat Digunakan</span>
                                <span class="font-bold text-amber-400 text-sm" x-text="liveChats.length + ' Chat'"></span>
                                <p class="text-[10px] text-gray-500">Jumlah interaksi pelanggan aktif.</p>
                            </div>
                            <div class="bg-gray-950 p-3 rounded-xl cyber-border space-y-1">
                                <span class="text-gray-400 block uppercase">Tambah Nilai (Top-Up)</span>
                                <a @click="clientTab = 'billing'" class="text-blue-400 hover:text-blue-300 font-bold underline cursor-pointer block">Beli Pakej Token &rarr;</a>
                                <p class="text-[10px] text-gray-500">Rujuk tab Langganan & Bil untuk top-up.</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tab Live Chat -->
                <div x-show="clientTab === 'livechat'" class="bg-gray-900 rounded-2xl cyber-border overflow-hidden">
                    <div class="p-4 border-b border-gray-800 flex justify-between items-center bg-gray-950 font-mono text-xs">
                        <span class="font-bold text-blue-300">Pusat Kawalan Live Chat WhatsApp</span>
                        <span class="text-emerald-400 animate-pulse">🟢 Real-Time Sync Active (<span x-text="liveChats.length"></span> Chats)</span>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-12 min-h-[450px]">
                        <div class="md:col-span-4 border-r border-gray-800 overflow-y-auto max-h-[450px] divide-y divide-gray-800">
                            <template x-for="chat in liveChats" :key="chat.id">
                                <div @click="activeChat = chat; $nextTick(() => { scrollToBottom(); })" class="p-3 cursor-pointer hover:bg-gray-800/40 transition font-mono text-xs" :class="activeChat && activeChat.id === chat.id ? 'bg-blue-950/50 border-l-4 border-blue-500' : ''">
                                    <div class="flex justify-between font-bold text-blue-200">
                                        <span x-text="chat.phone"></span>
                                        <span class="text-[10px] text-gray-500" x-text="chat.time"></span>
                                    </div>
                                    <div class="text-gray-400 truncate mt-1" x-text="chat.lastMessage"></div>
                                </div>
                            </template>
                            <template x-if="liveChats.length === 0">
                                <div class="p-4 text-center text-gray-500 font-mono text-xs">Sedang memuat turun data chat dari Google Sheets...</div>
                            </template>
                        </div>

                        <div class="md:col-span-8 flex flex-col bg-gray-950/40">
                            <template x-if="!activeChat">
                                <div class="flex items-center justify-center flex-grow p-8 text-gray-500 font-mono text-xs">
                                    Sila pilih senarai perbualan di sebelah kiri.
                                </div>
                            </template>

                            <template x-if="activeChat">
                                <div class="flex flex-col h-full flex-grow">
                                    <div class="p-3 bg-gray-900 border-b border-gray-800 font-mono text-xs font-bold text-blue-300" x-text="'Chat bersama: ' + activeChat.phone"></div>
                                    
                                    <div x-ref="chatContainer" class="p-4 overflow-y-auto space-y-3 flex-grow max-h-[320px] font-mono text-xs">
                                        <template x-for="msg in activeChat.messages">
                                            <div class="flex" :class="msg.sender === 'customer' ? 'justify-start' : 'justify-end'">
                                                <div class="max-w-[80%] rounded-xl px-3 py-2" :class="msg.sender === 'customer' ? 'bg-gray-900 text-gray-200' : 'bg-blue-600 text-white'">
                                                    <p x-text="msg.text"></p>
                                                    <span class="text-[9px] block text-right opacity-70 mt-0.5" x-text="msg.time"></span>
                                                </div>
                                            </div>
                                        </template>
                                    </div>

                                    <div class="p-3 bg-gray-900 border-t border-gray-800">
                                        <form @submit.prevent="sendReply()" class="flex space-x-2">
                                            <input type="text" x-model="replyText" placeholder="Taip mesej manual..." class="flex-grow px-3 py-2 bg-gray-950 border border-gray-800 rounded-xl text-xs font-mono text-blue-100 focus:outline-none">
                                            <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-mono font-bold rounded-xl">Hantar</button>
                                        </form>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- Tab Tetapan Brain Bot -->
                <div x-show="clientTab === 'brainbot'" class="bg-gray-900 p-6 rounded-2xl cyber-border space-y-6 font-mono text-xs">
                    <div class="border-b border-gray-800 pb-3">
                        <h3 class="font-bold text-sm text-blue-300"><i class="fa-solid fa-brain mr-2"></i> Konfigurasi Neural Brain Bot (AI Persona)</h3>
                        <p class="text-[10px] text-gray-400 mt-1">Tetapkan watak, nama bot, nada suara, dan skrip pengetahuan asas untuk pembantu maya WhatsApp anda.</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="md:col-span-2 space-y-4">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block uppercase text-blue-400 mb-1">Nama Identiti Bot</label>
                                    <input type="text" x-model="clientBot.botName" placeholder="contoh: sbltransport-bot" class="w-full p-2.5 bg-gray-950 border border-gray-800 rounded-xl text-blue-100 focus:outline-none">
                                </div>
                                <div>
                                    <label class="block uppercase text-blue-400 mb-1">Nada Suara (Tone)</label>
                                    <select x-model="botSettings.tone" class="w-full p-2.5 bg-gray-950 border border-gray-800 rounded-xl text-blue-100 focus:outline-none">
                                        <option value="professional">Profesional & Korporat</option>
                                        <option value="friendly">Mesra & Santai</option>
                                        <option value="direct">Padat & Terus Pada Poin</option>
                                    </select>
                                </div>
                            </div>

                            <div>
                                <label class="block uppercase text-blue-400 mb-1">System Instructions / AI Persona Prompt</label>
                                <textarea x-model="brainPrompt" rows="6" class="w-full p-3 bg-gray-950 border border-gray-800 rounded-xl text-blue-100 focus:outline-none leading-relaxed"></textarea>
                            </div>

                            <button @click="saveBrainSettings()" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow glow-effect transition">Simpan Tetapan Brain Bot</button>
                        </div>
                    </div>
                </div>

                <!-- Tab Affiliate & E-Wallet -->
                <div x-show="clientTab === 'affiliate'" class="bg-gray-900 p-6 rounded-2xl cyber-border space-y-6 font-mono text-xs">
                    <div class="border-b border-gray-800 pb-3 flex justify-between items-center">
                        <div>
                            <h3 class="font-bold text-sm text-blue-300"><i class="fa-solid fa-handshake-angle mr-2"></i> Program Affiliate & E-Wallet Komisen (10%)</h3>
                            <p class="text-[10px] text-gray-400 mt-1">Jana pendapatan pasif 10% setiap bulan daripada langganan sub-affiliate anda.</p>
                        </div>
                        <span class="px-3 py-1 bg-blue-500/20 text-blue-300 border border-blue-500/30 rounded-full font-bold" x-text="affiliateData.isAgent ? 'STATUS: AGEN AFFILIATE AKTIF 🟢' : 'STATUS: BELUM MENDAFTAR'"></span>
                    </div>

                    <template x-if="!affiliateData.isAgent">
                        <div class="space-y-6 bg-gray-950 p-6 rounded-2xl cyber-border">
                            <div class="space-y-2">
                                <h4 class="font-bold text-sm text-white uppercase">Terma & Syarat Agensi Affiliate</h4>
                                <p class="text-gray-300 text-[11px] leading-relaxed">Komisen 10% dibayar secara berkala selagi sub-affiliate mengekalkan langganan aktif bulanan.</p>
                            </div>
                            <form @submit.prevent="registerAffiliateAgent()" class="space-y-4">
                                <div class="flex items-center space-x-2">
                                    <input type="checkbox" x-model="affiliateForm.agreed" id="agreeTerm" required class="w-4 h-4 rounded bg-gray-950 border border-gray-800 text-blue-600">
                                    <label for="agreeTerm" class="text-gray-300 text-xs cursor-pointer">Saya bersetuju dengan terma & syarat program affiliate.</label>
                                </div>
                                <button type="submit" class="px-6 py-3 bg-blue-600 text-white font-bold rounded-xl shadow">Daftar Sebagai Agen Affiliate</button>
                            </form>
                        </div>
                    </template>

                    <template x-if="affiliateData.isAgent">
                        <div class="space-y-6">
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <div class="bg-gray-950 p-6 rounded-2xl cyber-border space-y-2">
                                    <span class="text-[10px] text-gray-400 uppercase">Baki E-Wallet (Komisen 10%)</span>
                                    <h3 class="text-3xl font-black text-emerald-400" x-text="'RM ' + affiliateData.walletBalance.toFixed(2)"></h3>
                                    <button @click="requestWithdrawal()" class="mt-2 w-full py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl transition shadow">Tuntut Pengeluaran (Payout)</button>
                                </div>
                                <div class="bg-gray-950 p-6 rounded-2xl cyber-border space-y-2">
                                    <span class="text-[10px] text-gray-400 uppercase">Sub-Affiliate Aktif</span>
                                    <h3 class="text-3xl font-black text-blue-400" x-text="affiliateData.totalReferrals">0</h3>
                                </div>
                                <div class="bg-gray-950 p-6 rounded-2xl cyber-border space-y-2">
                                    <span class="text-[10px] text-gray-400 uppercase">Jumlah Terkumpul</span>
                                    <h3 class="text-3xl font-black text-indigo-400" x-text="'RM ' + affiliateData.totalEarned.toFixed(2)"></h3>
                                </div>

                            <div class="bg-gray-950 p-6 rounded-2xl cyber-border space-y-3">
                                <label class="block uppercase text-blue-400 font-bold">Pautan Rujukan Affiliate Unik</label>
                                <div class="flex space-x-2">
                                    <input type="text" readonly :value="'https://leea-portal.vercel.app/?ref=' + currentUser.username" class="w-full px-4 py-2.5 bg-gray-900 border border-gray-800 rounded-xl text-blue-300 select-all">

                            <div class="bg-gray-950 p-6 rounded-2xl cyber-border space-y-4">
                                <h4 class="font-bold text-sm text-blue-300 uppercase">Maklumat Akaun Bank / DuitNow</h4>
                                <form @submit.prevent="saveBankAccount()" class="space-y-4 max-w-xl">
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label class="block uppercase text-gray-400 mb-1">Bank / E-Wallet</label>
                                            <select x-model="affiliateBank.bankName" required class="w-full px-3 py-2.5 bg-gray-900 border border-gray-800 rounded-xl text-blue-100">
                                                <option value="">Pilih Bank</option>
                                                <option value="Touch 'n Go eWallet (DuitNow)">Touch 'n Go eWallet</option>
                                                <option value="GXBank">GXBank</option>
                                                <option value="Maybank">Maybank</option>
                                                <option value="CIMB Bank">CIMB Bank</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label class="block uppercase text-gray-400 mb-1">No Akaun / No Telefon</label>
                                            <input type="text" x-model="affiliateBank.accountNo" required class="w-full px-3 py-2.5 bg-gray-900 border border-gray-800 rounded-xl text-blue-100">
                                        </div>
                                    </div>
                                    <div>
                                        <label class="block uppercase text-gray-400 mb-1">Nama Pemilik</label>
                                        <input type="text" x-model="affiliateBank.accountHolder" required class="w-full px-3 py-2.5 bg-gray-900 border border-gray-800 rounded-xl text-blue-100">

                </div>

                <!-- Tab Langganan & Bil -->
                <div x-show="clientTab === 'billing'" class="bg-gray-900 p-6 rounded-2xl cyber-border space-y-6 font-mono text-xs">
                    <div class="flex justify-between items-center border-b border-gray-800 pb-3">
                        <h3 class="font-bold text-sm text-blue-300"><i class="fa-solid fa-credit-card mr-2"></i> Maklumat Pelan & Top-Up Token</h3>
                        <span class="px-3 py-1 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-full font-bold">STATUS: AKTIF 🟢</span>
                    </div>

                    <div class="space-y-3">
                        <h4 class="font-bold text-white uppercase text-xs">Pembelian Token Chat WhatsApp</h4>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="p-4 bg-gray-950 rounded-xl cyber-border space-y-3">
                                <h5 class="font-bold text-blue-300">Pakej 500 Token WhatsApp</h5>
                                <p class="text-gray-400 text-[11px]">Harga: <strong>RM300.00</strong></p>
                                <div class="flex space-x-2">
                                    <a href="https://toyyibpay.com/Leea-System-500-Token-Chat" target="_blank" class="flex-1 py-2 bg-blue-600 text-white text-center font-bold rounded-lg">Bayar Online</a>
                                    <button @click="buyTokenWithWallet(500)" class="px-3 py-2 bg-emerald-600 text-white font-bold rounded-lg text-[10px]">Guna E-Wallet</button>
                                </div>
                            </div>

                            <div class="p-4 bg-gray-950 rounded-xl cyber-border space-y-3">
                                <h5 class="font-bold text-blue-300">Pakej 1000 Token WhatsApp</h5>
                                <p class="text-gray-400 text-[11px]">Harga: <strong>RM500.00</strong></p>
                                <div class="flex space-x-2">
                                    <a href="https://toyyibpay.com/Leea-Sistem-1000-token" target="_blank" class="flex-1 py-2 bg-blue-600 text-white text-center font-bold rounded-lg">Bayar Online</a>
                                    <button @click="buyTokenWithWallet(1000)" class="px-3 py-2 bg-emerald-600 text-white font-bold rounded-lg text-[10px]">Guna E-Wallet</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-center pt-4 border-t border-gray-800">
                        <div class="p-5 bg-gray-950 rounded-xl cyber-border space-y-3">
                            <span class="px-2.5 py-1 text-[10px] font-bold rounded-full bg-blue-500/20 text-blue-300" x-text="'Pelan: ' + clientBot.planTier.toUpperCase()"></span>
                            <h4 class="text-base font-bold text-white">LEEA WhatsApp Automation Standard</h4>
                            <p class="text-gray-400">Kadar Semasa: <strong class="text-blue-300">RM130</strong> per bulan</p>
                        </div>
                        <div class="p-5 bg-gradient-to-br from-blue-950/60 to-gray-950 rounded-xl cyber-border space-y-4 text-center">
                            <a href="https://toyyibpay.com/Architech-Laboratory" target="_blank" class="inline-flex items-center justify-center space-x-2 w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold rounded-xl shadow-lg glow-effect">
                                <i class="fa-solid fa-lock text-xs"></i>
                                <span>Renew Langganan (RM130)</span>
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Tab Profil -->
                <div x-show="clientTab === 'profile'" class="bg-gray-900 p-6 rounded-2xl cyber-border space-y-6 font-mono text-xs">
                    <div class="border-b border-gray-800 pb-3">
                        <h3 class="font-bold text-sm text-blue-300"><i class="fa-solid fa-building mr-2"></i> Profil & Tetapan Syarikat Klien</h3>
                    </div>
                    <form @submit.prevent="saveClientCompanyProfile()" class="space-y-4 max-w-2xl">
                        <div>
                            <label class="block uppercase text-blue-400 mb-1">Nama Syarikat</label>
                            <input type="text" x-model="clientProfile.companyName" required class="w-full px-3 py-2.5 bg-gray-950 border border-gray-800 rounded-xl text-blue-100">
                        </div>
                        <div>
                            <label class="block uppercase text-blue-400 mb-1">Muat Naik Logo</label>
                            <input type="file" @change="handleLogoUpload($event)" accept="image/*" class="w-full text-xs text-gray-400 bg-gray-950 border border-gray-800 rounded-xl">
                        </div>
                        <button type="submit" class="px-6 py-2.5 bg-blue-600 text-white font-bold rounded-xl shadow">Simpan Profil</button>
                    </form>
                </div>
            </div>
        </template>

        <!-- POPUP MODAL MESSAGE INBOX -->
        <div x-show="showInboxModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4 font-mono" x-cloak>
            <div class="bg-gray-900 border border-blue-500/40 rounded-2xl w-full max-w-lg shadow-2xl overflow-hidden glow-effect">
                <div class="p-4 bg-gray-950 border-b border-gray-800 flex justify-between items-center">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-bell text-blue-400"></i>
                        <h3 class="font-bold text-sm text-blue-300 uppercase tracking-wider">Message Inbox (Pusat Notifikasi)</h3>
                    </div>
                    <button @click="showInboxModal = false" class="text-gray-400 hover:text-red-400 p-2 transition text-base focus:outline-none">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <div class="p-6 max-h-[420px] overflow-y-auto space-y-4">
                    <template x-for="(msg, mIdx) in clientMessages.slice(0, 10)" :key="mIdx">
                        <div @click="openMessageDetail(msg, mIdx)" class="p-4 rounded-xl cyber-border space-y-2 transition cursor-pointer hover:border-blue-400" :class="msg.isRead ? 'bg-gray-950/60 border-gray-800 opacity-75' : 'bg-gray-950 border-blue-500/60 shadow-lg'">
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-blue-400 text-xs" x-text="msg.senderTitle || 'Master Administrator'"></span>
                                <span class="text-[10px] text-gray-500" x-text="msg.date"></span>
                            </div>
                            <p class="text-gray-200 text-xs truncate" x-text="msg.content"></p>
                        </div>
                    </template>
                </div>
            </div>
        </div>

    </main>

    <footer class="mt-auto py-6 border-t border-gray-900 text-center text-xs font-mono text-gray-500">
        &copy; 2026 LEEA AI SYSTEM. All Rights Reserved.
    </footer>

    <script>
        function appData() {
            return {
                isLoggedIn: false,
                clientTab: 'dashboard',
                loginForm: { username: '', password: '' },
                showPassword: false,
                loginError: '',
                currentUser: null,
                clients: [],
                liveChats: [],
                activeChat: null,
                replyText: '',
                clientMessages: [],
                showInboxModal: false,
                showMsgDetailModal: false,
                selectedMessage: { senderTitle: '', date: '', content: '', index: null },
                brainPrompt: 'Anda adalah pembantu khidmat pelanggan profesional.',
                botSettings: { tone: 'professional' },
                clientBot: {
                    botName: 'bot',
                    planTier: 'v1 pro',
                    memoryUsageMb: 220,
                    tokenBalance: 1000
                },
                clientProfile: {
                    companyName: '',
                    logoUrl: '',
                    address: '',
                    facebookUrl: '',
                    instagramUrl: '',
                    bio: ''
                },
                affiliateData: {
                    isAgent: false,
                    walletBalance: 0.00,
                    totalReferrals: 0,
                    totalEarned: 0.00
                },
                affiliateForm: { agreed: false },
                affiliateBank: { bankName: '', accountNo: '', accountHolder: '' },

                get hasUnreadMessages() {
                    return this.clientMessages.some(m => !m.isRead);
                },

                init() {
                    const saved = localStorage.getItem('leea_admin_clients');
                    if (saved) {
                        try {
                            const parsed = JSON.parse(saved);
                            if (Array.isArray(parsed)) {
                                this.clients = parsed.filter(c => {
                                    const u = (c.username || '').toLowerCase();
                                    const comp = (c.companyName || '').toLowerCase();
                                    return !u.includes('architech') && !comp.includes('architech');
                                });
                            }
                        } catch(e) {}
                    }

                    const user = localStorage.getItem('leea_current_user');
                    if (user) {
                        try {
                            const parsedUser = JSON.parse(user);
                            const uname = (parsedUser.username || '').toLowerCase();
                            if (uname.includes('architech')) {
                                this.logout();
                            } else {
                                const matchedClient = this.clients.find(c => c.username === parsedUser.username);
                                if (matchedClient) {
                                    this.currentUser = parsedUser;
                                    this.isLoggedIn = true;
                                    if (matchedClient.planTier) this.clientBot.planTier = matchedClient.planTier;
                                    if (matchedClient.tokenBalance) this.clientBot.tokenBalance = matchedClient.tokenBalance;
                                    this.fetchLiveChats();
                                    this.loadClientMessages();
                                    this.loadCompanyProfileData();
                                    this.loadBrainSettings();
                                    this.loadAffiliateData();
                                } else {
                                    this.logout();
                                }
                            }
                        } catch(e) {
                            this.logout();
                        }
                    }

                    setInterval(() => {
                        if (this.isLoggedIn) {
                            this.fetchLiveChats();
                            this.loadClientMessages();
                        }
                    }, 4000);
                },

                scrollToBottom() {
                    if (this.$refs.chatContainer) {
                        this.$refs.chatContainer.scrollTop = this.$refs.chatContainer.scrollHeight;
                    }
                },

                openMessageDetail(msg, index) {
                    this.selectedMessage = { ...msg, index: index };
                    this.showMsgDetailModal = true;
                    if (!msg.isRead) {
                        this.clientMessages[index].isRead = true;
                        this.saveClientMessagesState();
                    }
                },

                buyTokenWithWallet(packageSize) {
                    let cost = packageSize === 500 ? 300 : 500;
                    if (this.affiliateData.walletBalance < cost) {
                        alert('Baki E-Wallet tidak mencukupi untuk pembelian ' + packageSize + ' token (RM ' + cost + '.00).');
                        return;
                    }
                    if (confirm('Tebus ' + packageSize + ' token menggunakan baki E-Wallet (RM ' + cost + '.00)?')) {
                        this.affiliateData.walletBalance -= cost;
                        this.saveAffiliateDataToStorage();
                        alert('Permohonan pembelian token berjaya dihantar kepada Administrator.');
                    }
                },

                saveClientMessagesState() {
                    if (!this.currentUser) return;
                    localStorage.setItem('leea_client_inbox_state_' + this.currentUser.username, JSON.stringify(this.clientMessages));
                },

                handleBotUpgrade() {
                    alert('Sila hubungi Administrator Master untuk menaik taraf pelan anda.');
                },

                handleLogoUpload(event) {
                    const file = event.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (e) => { this.clientProfile.logoUrl = e.target.result; };
                        reader.readAsDataURL(file);
                    }
                },

                loadCompanyProfileData() {
                    if (!this.currentUser) return;
                    const savedProfile = localStorage.getItem('leea_client_profile_' + this.currentUser.username);
                    if (savedProfile) {
                        try { this.clientProfile = JSON.parse(savedProfile); } catch(e) {}
                    }
                },

                saveClientCompanyProfile() {
                    if (!this.currentUser) return;
                    localStorage.setItem('leea_client_profile_' + this.currentUser.username, JSON.stringify(this.clientProfile));
                    alert('Profil syarikat dan logo berjaya disimpan!');
                },

                loadBrainSettings() {
                    if (!this.currentUser) return;
                    const savedBrain = localStorage.getItem('leea_brain_settings_' + this.currentUser.username);
                    if (savedBrain) {
                        try {
                            const parsed = JSON.parse(savedBrain);
                            this.brainPrompt = parsed.prompt || this.brainPrompt;
                            this.botSettings = parsed.settings || this.botSettings;
                            if (parsed.botName) this.clientBot.botName = parsed.botName;
                        } catch(e) {}
                    } else {
                        this.clientBot.botName = this.currentUser.username + '-bot';
                    }
                },

                saveBrainSettings() {
                    if (!this.currentUser) return;
                    const dataToSave = { prompt: this.brainPrompt, settings: this.botSettings, botName: this.clientBot.botName };
                    localStorage.setItem('leea_brain_settings_' + this.currentUser.username, JSON.stringify(dataToSave));
                    alert('Tetapan Brain Bot berjaya disimpan!');
                },

                loadAffiliateData() {
                    if (!this.currentUser) return;
                    const savedAff = localStorage.getItem('leea_affiliate_' + this.currentUser.username);
                    if (savedAff) {
                        try {
                            const parsed = JSON.parse(savedAff);
                            this.affiliateData = parsed.data || this.affiliateData;
                            this.affiliateBank = parsed.bank || this.affiliateBank;
                        } catch(e) {}
                    }
                },

                registerAffiliateAgent() {
                    if (!this.affiliateForm.agreed) { alert('Sila bersetuju dengan terma & syarat.'); return; }
                    this.affiliateData.isAgent = true;
                    this.saveAffiliateDataToStorage();
                    alert('Tahniah! Anda rasmi berdaftar sebagai Agen Affiliate.');
                },

                saveBankAccount() {
                    this.saveAffiliateDataToStorage();
                    alert('Maklumat akaun bank / DuitNow berjaya disimpan.');
                },

                saveAffiliateDataToStorage() {
                    if (!this.currentUser) return;
                    const payload = { data: this.affiliateData, bank: this.affiliateBank };
                    localStorage.setItem('leea_affiliate_' + this.currentUser.username, JSON.stringify(payload));
                },

                copyAffiliateLink() {
                    navigator.clipboard.writeText('https://leea-portal.vercel.app/?ref=' + this.currentUser.username);
                    alert('Pautan rujukan affiliate disalin!');
                },

                requestWithdrawal() {
                    if (this.affiliateData.walletBalance < 1.00) { alert('Minimum pengeluaran RM1.00.'); return; }
                    if (!this.affiliateBank.accountNo) { alert('Sila tetapkan akaun bank terlebih dahulu.'); return; }
                    alert('Permohonan pengeluaran berjaya dihantar!');
                    this.affiliateData.walletBalance = 0;
                    this.saveAffiliateDataToStorage();
                },

                async loadClientMessages() {
                    if (!this.currentUser) return;
                    const inboxUrl = "https://script.google.com/macros/s/AKfycbyu_sszjigSPdhk0ZCGfidw4co91_Cea-LjtFU4iH50ivfGMSnM5FxmKvrCPSrARRSA/exec?t=" + new Date().getTime();
                    try {
                        const res = await fetch(inboxUrl);
                        const data = await res.json();
                        if (data && data.status === "success" && Array.isArray(data.data)) {
                            const msgs = [];
                            data.data.forEach(row => {
                                if (row.type === 'inbox' || row.role === 'admin') {
                                    msgs.push({ senderTitle: row.sender || 'Admin', date: row.timestamp, content: row.message, isRead: false });
                                }
                            });
                            this.clientMessages = msgs.reverse();
                        }
                    } catch(err) {}
                },

                async fetchLiveChats() {
                    const url = "https://script.google.com/macros/s/AKfycbyTMhmYpFMzbEzGM8NoUTczMZU87PUmuq64HLd4gC7PzUgBiILKWohT_RGa6xyi7pMAVw/exec?t=" + new Date().getTime();
                    try {
                        const res = await fetch(url);
                        const data = await res.json();
                        if (data && data.status === "success" && Array.isArray(data.data)) {
                            const chatMap = {};
                            data.data.forEach(row => {
                                if (row.type !== 'chat') return;
                                let phone = row.phone || '601123687357';
                                const clean = phone.replace(/[^0-9]/g, '');
                                if (!chatMap[clean]) {
                                    chatMap[clean] = { id: 'chat-' + clean, phone: clean, lastMessage: '', time: '', messages: [] };
                                }
                                if (row.message) {
                                    chatMap[clean].messages.push({ sender: row.role || 'customer', text: row.message, time: row.timestamp });
                                    chatMap[clean].lastMessage = row.message;
                                    chatMap[clean].time = row.timestamp;
                                }
                            });
                            this.liveChats = Object.values(chatMap);
                            if (this.liveChats.length > 0 && !this.activeChat) {
                                this.activeChat = this.liveChats[0];
                            }
                        }
                    } catch(err) {}
                },

                sendReply() {
                    if (!this.replyText.trim() || !this.activeChat) return;
                    this.activeChat.messages.push({ sender: 'agent', text: this.replyText, time: 'Now' });
                    this.activeChat.lastMessage = this.replyText;
                    this.replyText = '';
                    this.$nextTick(() => { this.scrollToBottom(); });
                },

                login() {
                    const found = this.clients.find(c => c.username === this.loginForm.username && c.password === this.loginForm.password);
                    if (found) {
                        this.currentUser = { username: found.username, clientId: found.clientId || 'CLI-1001', status: found.status || 'Paid 🟢', expiryDate: found.expiryDate || '27/09/2026', lastLogin: 'Hari Ini' };
                        this.isLoggedIn = true;
                        localStorage.setItem('leea_current_user', JSON.stringify(this.currentUser));
                        this.fetchLiveChats();
                        this.loadClientMessages();
                        this.loadCompanyProfileData();
                        this.loadBrainSettings();
                        this.loadAffiliateData();
                    } else {
                        this.loginError = 'ID atau Katalaluan Salah!';
                    }
                },

                logout() {
                    this.isLoggedIn = false;
                    this.currentUser = null;
                    localStorage.removeItem('leea_current_user');
                }
            }
        }
    </script>
