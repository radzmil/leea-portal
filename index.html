<!DOCTYPE html>
<html lang="ms" x-data="appData()" x-init="init()" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEEA System - AI Digital Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#1d4ed8',
                        darkBg: '#030712',
                        cardDark: '#0f172a',
                        cyberBlue: '#60a5fa'
                    }
                }
            }
        }
    </script>
    <style>
        .ai-digital-bg {
            background: radial-gradient(circle at 50% 0%, #1e3a8a 0%, #0f172a 50%, #030712 100%);
            position: relative;
            overflow: hidden;
        }
        .ai-digital-bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(59, 130, 246, 0.05) 1px, transparent 1px), 
                              linear-gradient(90deg, rgba(59, 130, 246, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
        }
        .glow-effect {
            box-shadow: 0 0 25px -5px rgba(59, 130, 246, 0.3);
        }
        .cyber-border {
            border: 1px solid rgba(59, 130, 246, 0.2);
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 font-sans antialiased min-h-screen flex flex-col">

    <header class="bg-gray-900/80 backdrop-blur-md border-b border-blue-500/20 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center glow-effect">
                    <i class="fa-solid fa-microchip text-white text-sm"></i>
                </div>
                <span class="font-black text-lg tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-300">LEEA AI SYSTEM</span>
            </div>

            <template x-if="isLoggedIn">
                <div class="flex items-center space-x-3 border-l pl-4 border-gray-800 font-mono text-xs">
                    <div class="text-right">
                        <span class="block font-bold text-blue-300" x-text="currentUser.username"></span>
                        <span class="text-[10px] text-indigo-400 uppercase" x-text="'CLIENT (' + currentUser.clientId + ')'"></span>
                    </div>
                    <button @click="logout()" class="text-red-400 hover:text-red-300 p-2 transition" title="Log Keluar">
                        <i class="fa-solid fa-power-off"></i>
                    </button>
                </div>
            </template>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col justify-center">

        <!-- Skrin Login Klien -->
        <template x-if="!isLoggedIn">
            <div class="max-w-md mx-auto space-y-6 w-full">
                <div class="ai-digital-bg rounded-3xl p-6 md:p-8 text-white shadow-2xl glow-effect cyber-border backdrop-blur-md">
                    <div class="text-center space-y-1 mb-6">
                        <h2 class="text-2xl font-black tracking-wider uppercase text-transparent bg-clip-text bg-gradient-to-r from-blue-300 via-white to-indigo-400">
                            Neural Authentication
                        </h2>
                        <p class="text-xs text-gray-400 font-mono">Portal Klien AI Automasi Bot</p>
                    </div>

                    <form @submit.prevent="login()" class="space-y-4 font-mono text-xs">
                        <div>
                            <label class="block uppercase text-blue-400 mb-1">Username Klien</label>
                            <input type="text" x-model="loginForm.username" required class="w-full px-4 py-2.5 bg-gray-950 border border-gray-800 rounded-xl text-blue-100 focus:outline-none">
                        </div>
                        <div>
                            <label class="block uppercase text-blue-400 mb-1">Password</label>
                            <input type="password" x-model="loginForm.password" required class="w-full px-4 py-2.5 bg-gray-950 border border-gray-800 rounded-xl text-blue-100 focus:outline-none">
                        </div>
                        <div class="text-red-400" x-text="loginError"></div>
                        <button type="submit" class="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold rounded-xl shadow-lg glow-effect">AKSES PORTAL</button>
                    </form>
                </div>
            </div>
        </template>

        <!-- Papan Pemuka Klien -->
        <template x-if="isLoggedIn">
            <div class="space-y-6">
                <div class="bg-gradient-to-r from-blue-900/50 via-indigo-900/40 to-gray-900 rounded-2xl p-6 text-white cyber-border glow-effect flex justify-between items-center font-mono">
                    <div>
                        <h1 class="text-2xl font-black text-white" x-text="'Selamat Datang, ' + currentUser.username"></h1>
                        <p class="text-indigo-300 text-xs mt-1" x-text="'ID Klien: ' + currentUser.clientId + ' | Tarikh Luput: ' + currentUser.expiryDate"></p>
                    </div>
                </div>

                <!-- Tab Navigasi -->
                <div class="flex space-x-2 border-b border-gray-800 pb-2">
                    <button @click="clientTab = 'livechat'" :class="clientTab === 'livechat' ? 'bg-blue-600 text-white' : 'bg-gray-900 text-gray-400'" class="px-4 py-2 rounded-xl font-mono text-xs transition">
                        <i class="fa-solid fa-comments mr-2"></i> Live Chat & Bot Control
                    </button>
                    <button @click="clientTab = 'brainbot'" :class="clientTab === 'brainbot' ? 'bg-blue-600 text-white' : 'bg-gray-900 text-gray-400'" class="px-4 py-2 rounded-xl font-mono text-xs transition">
                        <i class="fa-solid fa-brain mr-2"></i> Tetapan Brain Bot
                    </button>
                </div>

                <!-- Tab Live Chat -->
                <div x-show="clientTab === 'livechat'" class="bg-gray-900 rounded-2xl cyber-border overflow-hidden">
                    <div class="p-4 border-b border-gray-800 flex justify-between items-center bg-gray-950 font-mono text-xs">
                        <span class="font-bold text-blue-300">Pusat Kawalan Live Chat WhatsApp</span>
                        <span class="text-emerald-400 animate-pulse">🟢 Real-Time Sync Active (<span x-text="liveChats.length"></span> Chats)</span>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-12 min-h-[450px]">
                        <div class="md:col-span-4 border-r border-gray-800 overflow-y-auto max-h-[450px] divide-y divide-gray-800">
                            <template x-for="chat in liveChats" :key="chat.id">
                                <div @click="activeChat = chat" class="p-3 cursor-pointer hover:bg-gray-800/40 transition font-mono text-xs" :class="activeChat && activeChat.id === chat.id ? 'bg-blue-950/50 border-l-4 border-blue-500' : ''">
                                    <div class="flex justify-between font-bold text-blue-200">
                                        <span x-text="chat.phone"></span>
                                        <span class="text-[10px] text-gray-500" x-text="chat.time"></span>
                                    </div>
                                    <div class="text-gray-400 truncate mt-1" x-text="chat.lastMessage"></div>
                                </div>
                            </template>
                            <template x-if="liveChats.length === 0">
                                <div class="p-4 text-center text-gray-500 font-mono text-xs">Sedang memuat turun data chat dari Google Sheets...</div>
                            </template>
                        </div>

                        <div class="md:col-span-8 flex flex-col bg-gray-950/40">
                            <template x-if="!activeChat">
                                <div class="flex items-center justify-center flex-grow p-8 text-gray-500 font-mono text-xs">
                                    Sila pilih senarai perbualan di sebelah kiri.
                                </div>
                            </template>

                            <template x-if="activeChat">
                                <div class="flex flex-col h-full flex-grow">
                                    <div class="p-3 bg-gray-900 border-b border-gray-800 font-mono text-xs font-bold text-blue-300" x-text="'Chat bersama: ' + activeChat.phone"></div>
                                    
                                    <div class="p-4 overflow-y-auto space-y-3 flex-grow max-h-[320px] font-mono text-xs">
                                        <template x-for="msg in activeChat.messages">
                                            <div class="flex" :class="msg.sender === 'customer' ? 'justify-start' : 'justify-end'">
                                                <div class="max-w-[80%] rounded-xl px-3 py-2" :class="msg.sender === 'customer' ? 'bg-gray-900 text-gray-200' : 'bg-blue-600 text-white'">
                                                    <p x-text="msg.text"></p>
                                                    <span class="text-[9px] block text-right opacity-70 mt-0.5" x-text="msg.time"></span>
                                                </div>
                                            </div>
                                        </template>
                                    </div>

                                    <div class="p-3 bg-gray-900 border-t border-gray-800">
                                        <form @submit.prevent="sendReply()" class="flex space-x-2">
                                            <input type="text" x-model="replyText" placeholder="Taip mesej manual..." class="flex-grow px-3 py-2 bg-gray-950 border border-gray-800 rounded-xl text-xs font-mono text-blue-100 focus:outline-none">
                                            <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-mono font-bold rounded-xl">Hantar</button>
                                        </form>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- Tab Tetapan Brain Bot -->
                <div x-show="clientTab === 'brainbot'" class="bg-gray-900 p-6 rounded-2xl cyber-border space-y-4 font-mono text-xs">
                    <h3 class="font-bold text-sm text-blue-300">Tetapan Prompt Brain Bot (AI Persona)</h3>
                    <textarea x-model="brainPrompt" rows="6" class="w-full p-3 bg-gray-950 border border-gray-800 rounded-xl text-blue-100 focus:outline-none"></textarea>
                    <button @click="alert('Prompt disimpan!')" class="px-5 py-2.5 bg-blue-600 text-white font-bold rounded-xl">Simpan Prompt</button>
                </div>
            </div>
        </template>
    </main>

    <footer class="mt-auto py-6 border-t border-gray-900 text-center text-xs font-mono text-gray-500">
        &copy; 2026 LEEA AI SYSTEM. All Rights Reserved.
    </footer>

    <script>
        function appData() {
            return {
                isLoggedIn: false,
                clientTab: 'livechat',
                loginForm: { username: 'sbltransport', password: 'securepass456' },
                loginError: '',
                currentUser: null,
                clients: [
                    { clientId: 'CLI-1001', username: 'sbltransport', password: 'securepass456', status: 'Paid 🟢', expiryDate: '27/09/2026' }
                ],
                liveChats: [],
                activeChat: null,
                replyText: '',
                brainPrompt: 'Anda adalah pembantu khidmat pelanggan.',

                init() {
                    const saved = localStorage.getItem('leea_admin_clients');
                    if (saved) this.clients = JSON.parse(saved);

                    const user = localStorage.getItem('leea_current_user');
                    if (user) {
                        this.currentUser = JSON.parse(user);
                        this.isLoggedIn = true;
                        this.fetchLiveChats();
                    } else {
                        // Auto log masuk lalai untuk mudahkan paparan
                        const defaultC = this.clients[0];
                        this.currentUser = { username: defaultC.username, clientId: defaultC.clientId, status: defaultC.status, expiryDate: defaultC.expiryDate };
                        this.isLoggedIn = true;
                        this.fetchLiveChats();
                    }

                    setInterval(() => {
                        if (this.isLoggedIn) {
                            this.fetchLiveChats();
                        }
                    }, 4000);
                },

                login() {
                    const found = this.clients.find(c => c.username === this.loginForm.username && c.password === this.loginForm.password);
                    if (found) {
                        this.currentUser = { username: found.username, clientId: found.clientId, status: found.status, expiryDate: found.expiryDate };
                        this.isLoggedIn = true;
                        localStorage.setItem('leea_current_user', JSON.stringify(this.currentUser));
                        this.fetchLiveChats();
                    } else {
                        this.loginError = 'ID atau Katalaluan Salah!';
                    }
                },

                logout() {
                    this.isLoggedIn = false;
                    this.currentUser = null;
                    localStorage.removeItem('leea_current_user');
                },

                async fetchLiveChats() {
                    const url = "https://script.google.com/macros/s/AKfycbyvSzjcJblEzJNGMSqxVCwwoCMJts32fVB6Q6MnFV-Cqm8mgZIqIMxV5weJSPDwB1pf3g/exec?t=" + new Date().getTime();
                    try {
                        const res = await fetch(url);
                        const data = await res.json();
                        if (data && data.status === "success" && Array.isArray(data.data)) {
                            const chatMap = {};
                            let lastPhone = "601123687357";

                            data.data.forEach(row => {
                                let phone = row.phone ? String(row.phone).trim() : lastPhone;
                                if (!phone || phone === "Unknown") phone = lastPhone;
                                else lastPhone = phone;

                                const cleanPhone = phone.replace(/[^0-9]/g, '');
                                if (!chatMap[cleanPhone]) {
                                    chatMap[cleanPhone] = { id: 'chat-' + cleanPhone, phone: cleanPhone, lastMessage: '', time: '', messages: [] };
                                }
                                if (row.message) {
                                    chatMap[cleanPhone].messages.push({
                                        sender: row.sender || 'customer',
                                        text: row.message,
                                        time: row.timestamp ? String(row.timestamp).substring(11, 16) : ''
                                    });
                                    chatMap[cleanPhone].lastMessage = row.message;
                                    chatMap[cleanPhone].time = row.timestamp ? String(row.timestamp).substring(11, 16) : '';
                                }
                            });

                            this.liveChats = Object.values(chatMap);
                            if (this.liveChats.length > 0 && !this.activeChat) {
                                this.activeChat = this.liveChats[0];
                            }
                        }
                    } catch (err) {
                        console.error("Gagal tarik data chat:", err);
                    }
                },

                sendReply() {
                    if (!this.replyText.trim() || !this.activeChat) return;
                    this.activeChat.messages.push({ sender: 'agent', text: this.replyText, time: 'Now' });
                    this.activeChat.lastMessage = this.replyText;
                    this.replyText = '';
                }
            }
        }
    </script>
</body>
</html>
