<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leea AI System - Enterprise Client Portal Login</title>
    <style>
        :root {
            --bg-main: #030712;
            --bg-card: #0b1329;
            --border-color: #1e3a8a;
            --accent: #00f0ff;
            --text-main: #e0f2fe;
            --text-muted: #60a5fa;
            --success: #10b981;
            --danger: #ef4444;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-main); color: var(--text-main); margin: 0; padding: 20px; display: flex; flex-direction: column; min-height: 90vh; }
        
        .header { display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); border: 1px solid var(--border-color); padding: 15px 30px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 0 15px rgba(0,240,255,0.1); }
        .brand { font-weight: 700; font-size: 16px; color: var(--accent); letter-spacing: 1px; }
        
        .login-wrapper { flex-grow: 1; display: flex; justify-content: center; align-items: center; }
        .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 10px; padding: 30px; box-shadow: 0 0 25px rgba(0,0,0,0.7); width: 100%; max-width: 420px; }
        .card h3 { color: var(--accent); font-size: 14px; margin-top: 0; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; letter-spacing: 0.5px; text-align: center; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; color: var(--text-muted); font-size: 11px; font-weight: 500; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px 12px; border: 1px solid var(--border-color); background: #020617; color: var(--accent); border-radius: 6px; box-sizing: border-box; font-size: 12px; font-family: inherit; }
        input[type="text"]:focus, input[type="password"]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 8px rgba(0,240,255,0.3); }
        
        button.action-btn { width: 100%; background: rgba(0,240,255,0.1); border: 1px solid var(--accent); color: var(--accent); padding: 11px; font-size: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: all 0.2s; margin-top: 10px; }
        button.action-btn:hover { background: var(--accent); color: #030712; box-shadow: 0 0 15px var(--accent); }

        .error-alert { background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger); color: #f87171; padding: 10px; border-radius: 6px; font-size: 11px; text-align: center; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand">LEEA AI SYSTEM - ENTERPRISE CLIENT PORTAL</div>
        <div style="display: flex; gap: 15px; align-items: center; font-size: 12px;">
            <span style="color: #34d399;">Gateway: <strong>Online 🟢</strong></span>
        </div>
    </div>

    <div class="login-wrapper">
        <div class="card">
            <h3>LOG MASUK KLIEN PORTAL</h3>
            
            <div id="errorBox" class="error-alert">ID atau Katalaluan Salah! Sila cuba lagi.</div>

            <form onsubmit="handleClientLogin(event)">
                <div class="form-group">
                    <label>USERNAME KLIEN</label>
                    <input type="text" id="usernameField" placeholder="Masukkan username klien..." required>
                </div>
                <div class="form-group">
                    <label>PASSWORD KATA LALUAN</label>
                    <input type="password" id="passwordField" placeholder="••••••••••••" required>
                </div>
                <button type="submit" class="action-btn">AKSES PORTAL</button>
            </form>
        </div>
    </div>

    <script>
        function handleClientLogin(event) {
            event.preventDefault();
            const user = document.getElementById('usernameField').value.trim();
            const pass = document.getElementById('passwordField').value.trim();
            const errorBox = document.getElementById('errorBox');

            if (user && pass) {
                // Berjaya log masuk, arahkan ke fail dashboard portal.html
                window.location.href = 'portal.html';
            } else {
                errorBox.style.display = 'block';
            }
        }
    </script>
</body>
</html>
