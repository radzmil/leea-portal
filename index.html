<!DOCTYPE html>
<html lang="ms" x-data="appData()" x-init="init()" :class="{ 'dark': darkMode }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEEA System - AI Digital Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#1d4ed8',
                        darkBg: '#030712',
                        cardDark: '#0f172a',
                        cyberBlue: '#60a5fa'
                    }
                }
            }
        }
    </script>
    <style>
        .ai-digital-bg {
            background: radial-gradient(circle at 50% 0%, #1e3a8a 0%, #0f172a 50%, #030712 100%);
            position: relative;
            overflow: hidden;
        }
        .ai-digital-bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(59, 130, 246, 0.05) 1px, transparent 1px), 
                              linear-gradient(90deg, rgba(59, 130, 246, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
        }
        .glow-effect {
            box-shadow: 0 0 25px -5px rgba(59, 130, 246, 0.3);
        }
        .cyber-border {
            border: 1px solid rgba(59, 130, 246, 0.2);
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 font-sans antialiased min-h-screen flex flex-col transition-colors duration-200">

    <header class="bg-gray-900/80 backdrop-blur-md border-b border-blue-500/20 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center glow-effect">
                    <i class="fa-solid fa-microchip text-white text-sm"></i>
                </div>
                <span class="font-black text-lg tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-300">LEEA AI SYSTEM</span>
            </div>

            <div class="flex items-center space-x-4">
                <button @click="toggleLang()" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-gray-800 border border-blue-500/30 hover:border-blue-400 transition text-blue-300">
                    <span x-text="lang === 'ms' ? 'English (EN)' : 'Bahasa Melayu (BM)'"></span>
                </button>

                <button @click="darkMode = !darkMode" class="p-2 text-blue-400 hover:bg-gray-800 rounded-lg transition">
                    <i :class="darkMode ? 'fa-solid fa-sun' : 'fa-solid fa-moon'"></i>
                </button>

                <template x-if="isLoggedIn">
                    <div class="flex items-center space-x-3 border-l pl-4 border-gray-800">
                        <div class="text-right">
                            <span class="block text-sm font-bold text-blue-300" x-text="currentUser.username"></span>
                            <span class="text-xs text-indigo-400 uppercase tracking-wider" x-text="currentUser.role + ' (' + (currentUser.clientId || 'NODE') + ')'"></span>
                        </div>
                        <button @click="logout()" class="text-red-400 hover:text-red-300 p-2 transition" title="Log Keluar">
                            <i class="fa-solid fa-power-off"></i>
                        </button>
                    </div>
                </template>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col justify-center">

        <template x-if="!isLoggedIn">
            <div class="max-w-xl mx-auto space-y-6 w-full">
                <div class="ai-digital-bg rounded-3xl p-6 md:p-8 text-white shadow-2xl glow-effect cyber-border backdrop-blur-md">
                    
                    <div class="flex justify-between items-center mb-6 relative z-10">
                        <div class="flex items-center space-x-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-blue-500 animate-pulse"></span>
                            <span class="text-[10px] font-mono tracking-widest text-blue-400 uppercase">AI Neural Core v3.0</span>
                        </div>
                        <span class="text-[10px] uppercase tracking-widest bg-blue-600/30 border border-blue-400/40 text-blue-300 px-3 py-1 rounded-full font-mono">SECURE GATEWAY</span>
                    </div>

                    <div class="text-center space-y-1 mb-6 relative z-10">
                        <h2 class="text-2xl md:text-3xl font-black tracking-wider uppercase text-transparent bg-clip-text bg-gradient-to-r from-blue-300 via-white to-indigo-400">
                            Neural Authentication
                        </h2>
                        <p class="text-xs md:text-sm text-gray-400 font-mono">Sistem Automasi Pintar & Pengurusan Bot AI</p>
                    </div>

                    <div class="bg-gray-900/90 text-gray-100 rounded-2xl shadow-xl overflow-hidden cyber-border p-6 md:p-8 relative z-10">
                        <form @submit.prevent="login()" class="space-y-4">
                            <div>
                                <label class="block text-xs font-mono uppercase text-blue-400 mb-1" x-text="lang === 'ms' ? 'ID Pengguna / Sistem' : 'System Username'"></label>
                                <input type="text" x-model="loginForm.username" required class="w-full px-4 py-2.5 bg-gray-950 border border-gray-800 rounded-xl text-sm text-blue-100 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none transition">
                            </div>
                            <div>
                                <label class="block text-xs font-mono uppercase text-blue-400 mb-1" x-text="lang === 'ms' ? 'Kata Laluan Akses' : 'Access Password'"></label>
                                <div class="relative">
                                    <input :type="showPassword ? 'text' : 'password'" x-model="loginForm.password" required class="w-full px-4 py-2.5 pr-10 bg-gray-950 border border-gray-800 rounded-xl text-sm text-blue-100 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none transition">
                                    <button type="button" @click="showPassword = !showPassword" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500 hover:text-blue-400 focus:outline-none">
                                        <i :class="showPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="text-red-400 text-xs font-mono" x-text="loginError"></div>
                            <button type="submit" class="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold font-mono tracking-wider text-xs rounded-xl transition shadow-lg glow-effect" x-text="lang === 'ms' ? 'AKSES SISTEM (LOGIN)' : 'INITIALIZE LOGIN'"></button>
                        </form>
                    </div>
                </div>

                <div class="text-center">
                    <a href="https://wa.link/mvtkdr" target="_blank" class="inline-flex items-center justify-center space-x-2 px-5 py-3 bg-gray-900 border border-blue-500/30 hover:border-blue-500 text-blue-300 text-xs font-mono rounded-xl shadow-md transition transform hover:-translate-y-0.5">
                        <i class="fa-brands fa-whatsapp text-sm text-blue-400"></i>
                        <span x-text="lang === 'ms' ? 'Bantuan Teknikal AI (Support)' : 'AI Live Support'"></span>
                    </a>
                </div>
            </div>
        </template>

        <template x-if="isLoggedIn && currentUser.role === 'client'">
            <div class="space-y-6">
                <!-- Bar Utama Selamat Datang -->
                <div class="bg-gradient-to-r from-blue-900/50 via-indigo-900/40 to-gray-900 rounded-2xl p-6 text-white cyber-border glow-effect flex justify-between items-center backdrop-blur-md">
                    <div>
                        <div class="flex items-center space-x-2 mb-1">
                            <span class="w-2 h-2 rounded-full bg-blue-400 animate-ping"></span>
                            <span class="text-xs font-mono text-blue-400 uppercase tracking-widest">Neural Node Active</span>
                        </div>
                        <h1 class="text-2xl font-black text-white" x-text="(lang === 'ms' ? 'Selamat Datang, ' : 'Welcome, ') + currentUser.username"></h1>
                        <p class="text-indigo-300 text-xs font-mono mt-1" x-text="(lang === 'ms' ? 'ID Klien: ' : 'Client ID: ') + currentUser.clientId + ' | AI Standard Core'"></p>
                    </div>
                    <div class="bg-gray-900/80 cyber-border px-4 py-2.5 rounded-xl text-right">
                        <span class="block text-[10px] font-mono text-gray-400 uppercase" x-text="lang === 'ms' ? 'Tarikh Luput' : 'Expiry Date'"></span>
                        <span class="font-bold text-xs font-mono text-blue-300" x-text="currentUser.expiryDate"></span>
                    </div>
                </div>

                <!-- Tab Navigasi -->
                <div class="flex space-x-2 border-b border-gray-800 pb-2 overflow-x-auto">
                    <button @click="clientTab = 'dashboard'" :class="clientTab === 'dashboard' ? 'bg-blue-600 text-white glow-effect' : 'bg-gray-900 text-gray-400 hover:text-white cyber-border'" class="px-4 py-2 rounded-xl font-mono text-xs transition whitespace-nowrap">
                        <i class="fa-solid fa-chart-line mr-2"></i> Analytics & Neural
                    </button>
                    <button @click="clientTab = 'livechat'" :class="clientTab === 'livechat' ? 'bg-blue-600 text-white glow-effect' : 'bg-gray-900 text-gray-400 hover:text-white cyber-border'" class="px-4 py-2 rounded-xl font-mono text-xs transition whitespace-nowrap">
                        <i class="fa-solid fa-comments mr-2"></i> <span x-text="lang === 'ms' ? 'Live Chat & Kawalan Bot' : 'Live Chat & Bot Control'"></span>
                    </button>
                    <button @click="clientTab = 'brainbot'" :class="clientTab === 'brainbot' ? 'bg-blue-600 text-white glow-effect' : 'bg-gray-900 text-gray-400 hover:text-white cyber-border'" class="px-4 py-2 rounded-xl font-mono text-xs transition whitespace-nowrap">
                        <i class="fa-solid fa-brain mr-2"></i> <span x-text="lang === 'ms' ? 'Tetapan Brain Bot' : 'Brain Bot Settings'"></span>
                    </button>
                    <button @click="clientTab = 'billing'" :class="clientTab === 'billing' ? 'bg-blue-600 text-white glow-effect' : 'bg-gray-900 text-gray-400 hover:text-white cyber-border'" class="px-4 py-2 rounded-xl font-mono text-xs transition whitespace-nowrap">
                        <i class="fa-solid fa-credit-card mr-2"></i> <span x-text="lang === 'ms' ? 'Langganan & Bil' : 'Subscription & Billing'"></span>
                    </button>
                    <button @click="clientTab = 'profile'" :class="clientTab === 'profile' ? 'bg-blue-600 text-white glow-effect' : 'bg-gray-900 text-gray-400 hover:text-white cyber-border'" class="px-4 py-2 rounded-xl font-mono text-xs transition whitespace-nowrap">
                        <i class="fa-solid fa-user-gear mr-2"></i> <span x-text="lang === 'ms' ? 'Profil & Tetapan' : 'Profile & Settings'"></span>
                    </button>
                </div>

                <div x-show="clientTab === 'dashboard'" class="space-y-6">
                    <!-- Kotak Profil Bot (Bot Profile Box) -->
                    <div class="bg-gray-900 p-6 rounded-2xl cyber-border space-y-4">
                        <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-gray-800 pb-4 gap-4">
                            <div class="flex items-center space-x-3">
                                <div class="w-12 h-12 rounded-xl bg-blue-600/20 border border-blue-500/40 flex items-center justify-center text-blue-400">
                                    <i class="fa-solid fa-robot text-xl"></i>
                                </div>
                                <div>
                                    <span class="text-[10px] font-mono text-blue-400 uppercase tracking-widest">AI Bot Instance</span>
                                    <div class="flex items-center space-x-2 mt-0.5">
                                        <h3 class="text-lg font-bold font-mono text-white" x-text="botProfile.botName"></h3>
                                        <span class="px-2 py-0.5 bg-blue-500/20 text-blue-300 border border-blue-500/30 text-[10px] font-mono rounded-full font-bold" x-text="botProfile.botVersion"></span>
                                    </div>
                                </div>
                            </div>
                            <!-- Kapasiti Bot & Nama Server Dikemaskini -->
                            <div class="flex items-center space-x-4">
                                <div class="bg-gray-950 px-4 py-2.5 rounded-xl cyber-border text-right">
                                    <span class="block text-[10px] font-mono text-gray-400 uppercase">Kapasiti Memori Bot</span>
                                    <span class="font-bold text-xs font-mono text-emerald-400" x-text="botProfile.botCapacity"></span>
                                </div>
                                <div class="bg-gray-950 px-4 py-2.5 rounded-xl cyber-border text-right">
                                    <span class="block text-[10px] font-mono text-gray-400 uppercase">Pelayan Node</span>
                                    <span class="font-bold text-xs font-mono text-blue-300" x-text="botProfile.serverSlot"></span>
                                </div>
                            </div>
                        </div>

                        <!-- Borang Kemaskini Nama Bot -->
                        <div class="pt-2">
                            <form @submit.prevent="updateBotProfile()" class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
                                <div class="md:col-span-2">
                                    <label class="block text-xs font-mono uppercase text-blue-400 mb-1">Kemaskini Nama Bot WhatsApp Anda</label>
                                    <input type="text" x-model="botProfileInput.botName" required class="w-full px-4 py-2.5 bg-gray-950 border border-gray-800 rounded-xl text-xs font-mono text-blue-100 focus:border-blue-500 focus:outline-none">
                                </div>
                                <div>
                                    <button type="submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-bold font-mono text-xs rounded-xl shadow transition glow-effect">Simpan Nama Bot</button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                        <div class="bg-gray-900 p-6 rounded-2xl cyber-border">
                            <span class="text-xs font-mono text-gray-400 uppercase" x-text="lang === 'ms' ? 'Jumlah WhatsApp Chat' : 'Total WhatsApp Chats'"></span>
                            <h3 class="text-3xl font-black mt-2 text-blue-400 font-mono" x-text="getTotalChatCount()">0</h3>
                            <span class="text-[10px] font-mono text-gray-500 mt-1 block">Real-time neural sync</span>
                        </div>
                        
                        <div class="bg-gray-900 p-6 rounded-2xl cyber-border">
                            <span class="text-xs font-mono text-gray-400 uppercase" x-text="lang === 'ms' ? 'Chat Hari Ini' : 'Chats Today'"></span>
                            <h3 class="text-3xl font-black mt-2 text-indigo-400 font-mono" x-text="getTodayChatCount()">0</h3>
                            <span class="text-[10px] font-mono text-gray-500 mt-1 block">Unique data stream</span>
                        </div>

                        <div class="bg-gray-900 p-6 rounded-2xl cyber-border">
                            <span class="text-xs font-mono text-gray-400 uppercase" x-text="lang === 'ms' ? 'Chat Sebulan (Aktif)' : 'Monthly Chats'"></span>
                            <h3 class="text-3xl font-black mt-2 text-blue-300 font-mono" x-text="getMonthlyChatCount()">0</h3>
                            <span class="text-[10px] font-mono text-gray-500 mt-1 block">Cycle performance</span>
                        </div>

                        <div class="bg-gray-900 p-6 rounded-2xl cyber-border">
                            <span class="text-xs font-mono text-gray-400 uppercase" x-text="lang === 'ms' ? 'Status Akaun' : 'Account Status'"></span>
                            <h3 class="text-xl font-black mt-2 text-emerald-400 font-mono" x-text="currentUser.status"></h3>
                            <span class="text-[10px] font-mono text-gray-500 mt-1 block">System operational</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-gray-900 p-6 rounded-2xl cyber-border md:col-span-2 space-y-4">
                            <div class="flex justify-between items-center">
                                <h3 class="font-bold text-sm font-mono text-blue-300" x-text="lang === 'ms' ? 'Prestasi Interaksi Bot Mingguan' : 'Weekly Bot Interaction Performance'"></h3>
                                <span class="text-[10px] font-mono bg-blue-500/20 text-blue-300 border border-blue-500/30 px-2.5 py-1 rounded-full">AI Core Active</span>
                            </div>
                            <div class="grid grid-cols-2 gap-4 pt-2">
                                <div class="p-4 bg-gray-950 rounded-xl cyber-border">
                                    <span class="text-xs text-gray-400 uppercase font-mono">AI Neural Handled</span>
                                    <div class="text-2xl font-black text-blue-400 mt-1 font-mono" x-text="getAiHandledPercentage()">0%</div>
                                    <span class="text-[10px] text-gray-500 mt-0.5 block">Automated logic stream</span>
                                </div>
                                <div class="p-4 bg-gray-950 rounded-xl cyber-border">
                                    <span class="text-xs text-gray-400 uppercase font-mono">Human Intervention</span>
                                    <div class="text-2xl font-black text-indigo-400 mt-1 font-mono">10%</div>
                                    <span class="text-[10px] text-gray-500 mt-0.5 block">Manual override active</span>
                                </div>
                            </div>
                        </div>

                        <div class="bg-gray-900 p-6 rounded-2xl cyber-border space-y-4">
                            <h3 class="font-bold text-sm font-mono text-blue-300" x-text="lang === 'ms' ? 'Status Kesihatan Sistem' : 'System Health Status'"></h3>
                            <div class="space-y-3 pt-2 text-xs font-mono">
                                <div class="flex justify-between items-center p-2.5 bg-gray-950 rounded-xl cyber-border">
                                    <span>Meta WhatsApp API</span>
                                    <span class="text-emerald-400 font-bold">ONLINE 🟢</span>
                                </div>
                                <div class="flex justify-between items-center p-2.5 bg-gray-950 rounded-xl cyber-border">
                                    <span>Gemini Neural Brain</span>
                                    <span class="text-emerald-400 font-bold">ACTIVE 🟢</span>
                                </div>
                                <div class="flex justify-between items-center p-2.5 bg-gray-950 rounded-xl cyber-border">
                                    <span>Google Sheets DB</span>
                                    <span class="text-emerald-400 font-bold">SYNCED 🟢</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div x-show="clientTab === 'livechat'" class="space-y-6">
                    <div class="bg-gray-900 p-5 rounded-2xl cyber-border space-y-3">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-center">
                            <div class="flex items-center space-x-3">
                                <div class="p-3 bg-blue-500/10 text-blue-400 rounded-xl cyber-border">
                                    <i class="fa-solid fa-microchip text-xl"></i>
                                </div>
                                <div>
                                    <span class="text-xs font-mono uppercase text-gray-400" x-text="lang === 'ms' ? 'BAKI KUOTA TOKEN LEEA SISTEM' : 'REMAINING TOKEN QUOTA'"></span>
                                    <div class="text-xl font-black text-white font-mono">
                                        <span x-text="getRemainingFreeQuota()" class="text-blue-400">1000</span> / 1,000 <span class="text-xs font-normal text-gray-500 font-mono">chats</span>
                                    </div>
                                </div>
                            </div>
                            <div class="text-right">
                                <span class="text-xs font-mono text-gray-400 uppercase block">Anggaran Caj Semasa Meta:</span>
                                <span class="text-xl font-bold font-mono text-indigo-400" x-text="calculateMetaCost()">RM 0.00</span>
                            </div>
                        </div>
                    </div>

                    <div class="bg-gray-900 rounded-2xl cyber-border overflow-hidden">
                        <div class="p-4 border-b border-gray-800 flex justify-between items-center bg-gray-950">
                            <h3 class="font-bold text-sm font-mono text-blue-300" x-text="lang === 'ms' ? 'Pusat Kawalan Live Chat & Bot' : 'Live Chat & Bot Control Center'"></h3>
                            <span class="px-3 py-1 bg-blue-500/20 text-blue-300 cyber-border rounded-full text-xs font-mono flex items-center">
                                <span class="w-2 h-2 rounded-full bg-blue-400 animate-ping mr-2"></span> Neural Link Online
                            </span>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-12 min-h-[500px]">
                            <div class="md:col-span-5 border-r border-gray-800 overflow-y-auto max-h-[550px] divide-y divide-gray-800/60">
                                <template x-for="chat in liveChats" :key="chat.id">
                                    <div @click="selectActiveChat(chat)" 
                                         class="p-4 cursor-pointer transition hover:bg-gray-800/50 flex flex-col space-y-1"
                                         :class="activeChat && activeChat.id === chat.id ? 'bg-blue-950/40 border-l-4 border-blue-500' : ''">
                                        <div class="flex justify-between items-center">
                                            <span class="font-bold text-sm font-mono text-blue-200" x-text="chat.phone"></span>
                                            <span class="text-[10px] font-mono text-gray-500" x-text="chat.time"></span>
                                        </div>
                                        <div class="text-xs text-gray-400 truncate font-mono" x-text="chat.lastMessage"></div>
                                        <div class="flex justify-between items-center pt-1">
                                            <span class="text-[10px] px-2 py-0.5 rounded-full font-mono uppercase font-bold"
                                                  :class="chat.mode === 'ai' ? 'bg-blue-500/20 text-blue-300 border border-blue-500/30' : 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/30'"
                                                  x-text="chat.mode === 'ai' ? 'AI Neural Bot' : 'Human Override'"></span>
                                        </div>
                                    </div>
                                </template>
                            </div>

                            <div class="md:col-span-7 flex flex-col bg-gray-950/50">
                                <template x-if="!activeChat">
                                    <div class="flex flex-col items-center justify-center flex-grow p-8 text-center text-gray-500">
                                        <i class="fa-solid fa-terminal text-4xl mb-3 text-blue-500/40"></i>
                                        <p class="text-sm font-mono" x-text="lang === 'ms' ? 'Sila pilih saluran chat untuk dipantau.' : 'Select a communication stream.'"></p>
                                    </div>
                                </template>

                                <template x-if="activeChat">
                                    <div class="flex flex-col h-full flex-grow">
                                        <div class="p-3 bg-gray-900 border-b border-gray-800 flex justify-between items-center">
                                            <h4 class="font-bold text-sm font-mono text-blue-300" x-text="activeChat.phone"></h4>
                                            <button @click="toggleChatMode(activeChat.id)" class="px-3 py-1.5 rounded-xl text-xs font-mono font-bold text-white transition shadow" :class="activeChat.mode === 'ai' ? 'bg-indigo-600 hover:bg-indigo-500' : 'bg-blue-600 hover:bg-blue-500'">
                                                <span x-text="activeChat.mode === 'ai' ? 'Switch to Human' : 'Switch to AI Bot'"></span>
                                            </button>
                                        </div>

                                        <div class="p-4 overflow-y-auto space-y-3 flex-grow max-h-[380px]">
                                            <template x-for="(msg, mIdx) in activeChat.messages" :key="mIdx">
                                                <div class="flex" :class="msg.sender === 'customer' ? 'justify-start' : 'justify-end'">
                                                    <div class="max-w-[80%] rounded-2xl px-4 py-2.5 text-xs font-mono shadow-sm" :class="msg.sender === 'customer' ? 'bg-gray-900 text-gray-200 cyber-border' : 'bg-blue-600 text-white'">
                                                        <p x-text="msg.text" class="whitespace-pre-line"></p>
                                                        <span class="text-[9px] block text-right mt-1 opacity-70" x-text="msg.time"></span>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>

                                        <div class="p-3 bg-gray-900 border-t border-gray-800">
                                            <form @submit.prevent="sendReplyMessage()" class="flex items-center space-x-2">
                                                <input type="text" x-model="replyText" placeholder="Taip arahan atau mesej manual..." class="flex-grow px-4 py-2.5 bg-gray-950 border border-gray-800 rounded-xl text-xs font-mono text-blue-100 focus:border-blue-500 focus:outline-none">
                                                <button type="submit" class="px-4 py-2.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-mono font-bold rounded-xl transition">Hantar</button>
                                            </form>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>

                <div x-show="clientTab === 'brainbot'" class="space-y-6">
                    <div class="bg-gray-900 p-6 rounded-2xl cyber-border space-y-4">
                        <div class="flex justify-between items-center border-b border-gray-800 pb-4">
                            <div>
                                <h3 class="text-base font-bold font-mono text-blue-300">Tetapan Prompt Brain Bot (AI Persona & Info Asas)</h3>
                                <p class="text-xs font-mono text-gray-400 mt-0.5">Laraskan gaya bahasa, nada suara bot, maklumat harga asas, dan info perniagaan anda.</p>
                            </div>
                            <span class="text-xs font-mono bg-blue-500/20 text-blue-300 border border-blue-500/30 px-3 py-1 rounded-full font-bold">Max 2,000 Aksara</span>
                        </div>

                        <!-- Kotak Amaran & Panduan Khas untuk Klien -->
                        <div class="p-4 bg-blue-950/40 border border-blue-500/30 rounded-xl text-xs font-mono text-blue-200 space-y-1">
                            <div class="font-bold text-blue-400 flex items-center space-x-2">
                                <i class="fa-solid fa-circle-info"></i>
                                <span>PANDUAN PENGGUNAAN RUANG INI:</span>
                            </div>
                            <p class="text-gray-300 leading-relaxed">
                                • <strong>Boleh buat:</strong> Tetapkan cara bot menyapa pelanggan, ubah nada (mesra/formal), masukkan senarai harga produk, waktu operasi, atau info asas servis.<br>
                                • <strong>TIDAK BOLEH:</strong> Ruang ini <u>bukan</u> untuk menulis kod pengaturcaraan, tambah modul sistem baru, atau menyambung sistem pembayaran (payment gateway).
                            </p>
                        </div>

                        <form @submit.prevent="updateBrainBotPrompt()" class="space-y-4">
                            <div>
                                <label class="block text-xs font-mono uppercase text-blue-400 mb-1">Arahan Sistem / Prompt Bot</label>
                                <textarea x-model="brainPrompt" maxlength="2000" rows="8" placeholder="Contoh: Awak adalah pembantu khidmat pelanggan. Jawab dengan mesra. Harga produk adalah..." class="w-full p-4 bg-gray-950 border border-gray-800 rounded-xl text-xs font-mono text-blue-100 focus:border-blue-500 focus:outline-none"></textarea>
                                <div class="flex justify-between text-xs font-mono text-gray-500 mt-1">
                                    <span>Neural buffer limit</span>
                                    <span x-text="brainPrompt.length + ' / 2000 aksara'"></span>
                                </div>
                            </div>
                            <div>
                                <button type="submit" class="px-6 py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold font-mono text-xs rounded-xl shadow transition glow-effect">Kemas Kini Neural Prompt</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div x-show="clientTab === 'billing'" class="space-y-6">
                    <div class="bg-gray-900 p-6 rounded-2xl cyber-border">
                        <h3 class="text-base font-bold font-mono text-blue-300 mb-4">Maklumat Pelan Langganan Semasa</h3>
                        <div class="p-4 bg-gray-950 rounded-xl cyber-border">
                            <span class="bg-blue-500/20 text-blue-300 border border-blue-500/30 text-[10px] font-mono font-bold px-2.5 py-1 rounded-full uppercase">Pakej Standard AI</span>
                            <h4 class="text-lg font-bold font-mono text-white mt-2">LEEA WhatsApp Automation Standard</h4>
                            <p class="text-xs font-mono text-gray-400 mt-1">RM130 per bulan (Auto-Billing Enabled)</p>
                        </div>
                    </div>
                </div>

                <div x-show="clientTab === 'profile'" class="space-y-6">
                    <div class="bg-gray-900 p-6 rounded-2xl cyber-border">
                        <h3 class="text-base font-bold font-mono text-blue-300 mb-1">Kemaskini Profil & Tetapan Akses</h3>
                        <form @submit.prevent="updateClientProfile()" class="space-y-4 max-w-xl mt-4">
                            <div>
                                <label class="block text-xs font-mono uppercase text-blue-400 mb-1">Nama Syarikat / Username</label>
                                <input type="text" x-model="clientProfileForm.username" required class="w-full px-4 py-2.5 bg-gray-950 border border-gray-800 rounded-xl text-xs font-mono text-blue-100">
                            </div>
                            <div>
                                <label class="block text-xs font-mono uppercase text-blue-400 mb-1">Kata Laluan Baru (Pilihan)</label>
                                <input type="password" x-model="clientProfileForm.newPassword" placeholder="Biarkan kosong jika tidak mahu tukar" class="w-full px-4 py-2.5 bg-gray-950 border border-gray-800 rounded-xl text-xs font-mono text-blue-100">
                            </div>
                            <div>
                                <button type="submit" class="px-6 py-3 bg-blue-600 text-white font-bold font-mono text-xs rounded-xl shadow glow-effect">Simpan Perubahan Konfigurasi</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </template>
    </main>

    <footer class="mt-auto py-6 border-t border-gray-900 text-center text-xs font-mono text-gray-500">
        &copy; 2026 LEEA AI SYSTEM. Neural Network Active. All Rights Reserved.
    </footer>

    <script>
        function appData() {
            return {
                lang: 'ms',
                darkMode: true,
                isLoggedIn: false,
                clientTab: 'dashboard',
                loginForm: { username: '', password: '' },
                showPassword: false,
                loginError: '',
                currentUser: null,
                clients: [],
                activeChat: null,
                replyText: '',
                brainPrompt: 'Anda adalah pembantu peribadi digital rasmi LEEA System. Bantu pelanggan dengan mesra, profesional, dan berikan maklumat tepat berkaitan perkhidmatan kami.',
                liveChats: [],
                lastUpdatedTime: '',
                
                // Data Profil Bot Khas (Label Server ditukar ke Architech Server 01)
                botProfile: {
                    botName: 'bot-sbltransport',
                    botVersion: 'V1',
                    botCapacity: '500 MB RAM',
                    serverSlot: 'Architech Server 01'
                },
                botProfileInput: {
                    botName: 'bot-sbltransport'
                },

                init() {
                    this.fetchClientsFromBot();
                    this.updateTimestamp();

                    const rawHash = window.location.hash || '';
                    const cleanHash = rawHash.replace(/^#+/, '').trim();
                    const savedUser = localStorage.getItem('leea_current_user');

                    if (cleanHash) {
                        const foundClient = this.clients.find(c => c.clientId === cleanHash || c.username === cleanHash);
                        if (foundClient) {
                            this.currentUser = { username: foundClient.username, clientId: foundClient.clientId, role: 'client', status: foundClient.status, expiryDate: foundClient.expiryDate };
                            this.isLoggedIn = true;
                            localStorage.setItem('leea_current_user', JSON.stringify(this.currentUser));
                        }
                    } else if (savedUser) {
                        this.currentUser = JSON.parse(savedUser);
                        this.isLoggedIn = true;
                    } else {
                        const defaultClient = this.clients[0];
                        if (defaultClient) {
                            this.currentUser = { username: defaultClient.username, clientId: defaultClient.clientId, role: 'client', status: defaultClient.status, expiryDate: defaultClient.expiryDate };
                            this.isLoggedIn = true;
                            window.location.hash = defaultClient.clientId;
                            localStorage.setItem('leea_current_user', JSON.stringify(this.currentUser));
                        }
                    }

                    if (this.isLoggedIn && this.currentUser && this.currentUser.role === 'client') {
                        this.loadClientProfileData();
                        this.fetchLiveChats();
                        this.loadBotProfileData();
                    }

                    setInterval(() => {
                        if (this.isLoggedIn && this.currentUser && this.currentUser.role === 'client') {
                            this.fetchLiveChats();
                        }
                        this.updateTimestamp();
                    }, 4000);
                },

                loadBotProfileData() {
                    if (!this.currentUser) return;
                    const savedBotData = localStorage.getItem('leea_bot_profile_' + this.currentUser.username);
                    if (savedBotData) {
                        this.botProfile = JSON.parse(savedBotData);
                    } else {
                        this.botProfile = {
                            botName: this.currentUser.username + '-bot',
                            botVersion: 'V1',
                            botCapacity: '500 MB RAM',
                            serverSlot: 'Architech Server 01'
                        };
                    }
                    this.botProfileInput.botName = this.botProfile.botName;
                },

                updateBotProfile() {
                    if (!this.botProfileInput.botName.trim()) {
                        alert('Nama bot tidak boleh kosong!');
                        return;
                    }
                    this.botProfile.botName = this.botProfileInput.botName;
                    localStorage.setItem('leea_bot_profile_' + this.currentUser.username, JSON.stringify(this.botProfile));
                    alert('Nama bot berjaya dikemaskini!');
                },

                updateTimestamp() {
                    const now = new Date();
                    const options = { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
                    this.lastUpdatedTime = now.toLocaleString('en-GB', options);
                },

                fetchClientsFromBot() {
                    const savedClients = localStorage.getItem('leea_admin_clients');
                    if (savedClients) {
                        this.clients = JSON.parse(savedClients);
                    } else {
                        this.clients = [
                            { clientId: 'CLI-1001', username: 'sbltransport', password: 'securepass456', phone: '+60132434200', email: 'architechlabs.io@gmail.com', railwayUrl: 'https://web-production-07b92.up.railway.app', status: 'Paid 🟢', expiryDate: '27/09/2026' },
                            { clientId: 'CLI-1002', username: 'architechlaboratory', password: 'H@$$ayang8683', phone: '+601123687357', email: 'radzmil@gmail.com', railwayUrl: 'https://leeasystem-production.up.railway.app', status: 'Paid 🟢', expiryDate: '27/09/2026' }
                        ];
                        localStorage.setItem('leea_admin_clients', JSON.stringify(this.clients));
                    }
                },

                saveClientsToStorage() {
                    localStorage.setItem('leea_admin_clients', JSON.stringify(this.clients));
                    this.updateTimestamp();
                },

                async backupChatToGoogleDrive(chatPhone, senderText, senderType) {
                    const backupChatUrl = "https://script.google.com/macros/s/AKfycbz_8nxxhe_UEO-Pgy54s29Ar7ZIqWCYM_K8pngDiJjWx_C5lcrPb3LmgUAyfJebrEBl/exec";
                    const currentClient = this.currentUser ? this.currentUser.username : 'default';

                    try {
                        await fetch(backupChatUrl, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                timestamp: new Date().toISOString(),
                                client: currentClient,
                                phone: chatPhone,
                                sender: senderType,
                                message: senderText
                            })
                        });
                    } catch (error) {
                        console.error("Gagal menghantar auto-backup chat:", error);
                    }
                },

                getCurrentRailwayUrl() {
                    if (!this.currentUser) return null;
                    const client = this.clients.find(c => c.username === this.currentUser.username);
                    if (client && client.railwayUrl && client.railwayUrl.trim() !== '') {
                        return client.railwayUrl;
                    }
                    return null;
                },

                async fetchLiveChats() {
                    const currentUsername = this.currentUser ? this.currentUser.username : 'sbltransport';
                    const sheetsUrl = "https://script.google.com/macros/s/AKfycbz_8nxxhe_UEO-Pgy54s29Ar7ZIqWCYM_K8pngDiJjWx_C5lcrPb3LmgUAyfJebrEBl/exec?t=" + new Date().getTime();
                    
                    try {
                        const response = await fetch(sheetsUrl);
                        const data = await response.json();
                        
                        if (data && data.status === "success" && Array.isArray(data.data) && data.data.length > 0) {
                            const filteredRows = data.data.filter(row => {
                                const rowClient = row.client ? String(row.client).toLowerCase().trim() : 'sbltransport';
                                return rowClient === currentUsername.toLowerCase().trim();
                            });

                            const chatMap = {};
                            let lastKnownPhone = "601123687357";

                            filteredRows.forEach(row => {
                                let rawPhone = row.phone ? String(row.phone).trim() : "";
                                if (!rawPhone || rawPhone === "Unknown") {
                                    rawPhone = lastKnownPhone;
                                } else {
                                    lastKnownPhone = rawPhone;
                                }

                                const cleanPhone = rawPhone.replace(/[^0-9]/g, '');
                                const cleanId = 'chat-' + cleanPhone;
                                
                                if (!chatMap[cleanPhone]) {
                                    chatMap[cleanPhone] = {
                                        id: cleanId,
                                        phone: cleanPhone,
                                        lastMessage: "",
                                        time: "",
                                        mode: 'ai',
                                        messages: []
                                    };
                                }
                                
                                if (row.message) {
                                    let timeDisplay = "";
                                    if (row.timestamp) {
                                        const tStr = String(row.timestamp);
                                        timeDisplay = tStr.includes('T') ? tStr.split('T')[1].substring(0, 5) : tStr.substring(11, 16);
                                    }
                                    
                                    chatMap[cleanPhone].messages.push({
                                        sender: row.sender || 'customer',
                                        text: row.message,
                                        time: timeDisplay
                                    });
                                    chatMap[cleanPhone].lastMessage = row.message;
                                    chatMap[cleanPhone].time = row.timestamp ? String(row.timestamp).replace('T', ' ').substring(0, 16) : "";
                                }
                            });
                            
                            this.liveChats = Object.values(chatMap);

                            if (this.liveChats.length > 0) {
                                if (!this.activeChat) {
                                    this.activeChat = this.liveChats[0];
                                } else {
                                    const activePhone = this.activeChat.phone;
                                    const matched = this.liveChats.find(c => c.phone === activePhone);
                                    if (matched) {
                                        this.activeChat = matched;
                                    } else {
                                        this.activeChat = this.liveChats[0];
                                    }
                                }
                            } else {
                                this.activeChat = null;
                                this.liveChats = [];
                            }
                        } else {
                            this.liveChats = [];
                            this.activeChat = null;
                        }
                    } catch (error) {
                        console.error("Gagal menarik data dari Google Sheets:", error);
                    }
                },

                async updateBrainBotPrompt() {
                    if (this.brainPrompt.length > 2000) {
                        alert('Prompt melebihi had 2,000 aksara!');
                        return;
                    }
                    const baseUrl = this.getCurrentRailwayUrl();
                    if (!baseUrl) {
                        alert('Ralat Keselamatan: Domain Railway Bot untuk akaun anda tidak ditetapkan.');
                        return;
                    }
                    const username = this.currentUser ? this.currentUser.username : '';

                    try {
                        const response = await fetch(`${baseUrl}/api/${username}/prompt`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ prompt: this.brainPrompt })
                        });
                        const data = await response.json();
                        if (data.success) {
                            alert(`Prompt Neural Bot untuk akaun [${username}] berjaya dikemaskini!`);
                        } else {
                            alert('Gagal mengemaskini prompt pada server.');
                        }
                    } catch (error) {
                        console.error('Ralat mengemaskini prompt:', error);
                        alert(`Tetapan prompt untuk ${username} disimpan.`);
                    }
                },

                async sendReplyMessage() {
                    if (!this.replyText.trim() || !this.activeChat) return;
                    
                    const replyMsg = this.replyText;
                    const phoneNum = this.activeChat.phone;

                    this.activeChat.messages.push({
                        sender: 'agent',
                        text: replyMsg,
                        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    });
                    this.activeChat.lastMessage = replyMsg;
                    this.replyText = '';

                    await this.backupChatToGoogleDrive(phoneNum, replyMsg, 'agent');
                },

                async toggleChatMode(chatId) {
                    const chat = this.liveChats.find(c => c.id === chatId);
                    if (chat) {
                        chat.mode = chat.mode === 'ai' ? 'human' : 'ai';
                    }
                },

                loadClientProfileData() {
                    const c = this.clients.find(x => x.username === this.currentUser.username);
                    if (c) {
                        this.clientProfileForm = { 
                            username: c.username, 
                            phone: c.phone || '', 
                            email: c.email || '',
                            newPassword: ''
                        };
                    }
                },

                updateClientProfile() {
                    const clientIndex = this.clients.findIndex(x => x.username === this.currentUser.username);
                    if (clientIndex !== -1) {
                        this.clients[clientIndex].username = this.clientProfileForm.username;
                        
                        if (this.clientProfileForm.newPassword.trim() !== '') {
                            this.clients[clientIndex].password = this.clientProfileForm.newPassword;
                        }

                        this.currentUser.username = this.clientProfileForm.username;
                        localStorage.setItem('leea_current_user', JSON.stringify(this.currentUser));
                        
                        this.saveClientsToStorage();
                        this.clientProfileForm.newPassword = '';
                        alert('Profil berjaya dikemaskini!');
                    } else {
                         alert('Ralat mengemaskini profil.');
                    }
                },

                selectActiveChat(chat) {
                    this.activeChat = chat;
                },

                toggleLang() {
                    this.lang = this.lang === 'ms' ? 'en' : 'ms';
                },

                login() {
                    this.loginError = '';
                    const found = this.clients.find(c => c.username === this.loginForm.username && c.password === this.loginForm.password);
                    if (found) {
                        this.currentUser = { username: found.username, clientId: found.clientId, role: 'client', status: found.status, expiryDate: found.expiryDate };
                        this.isLoggedIn = true;
                        localStorage.setItem('leea_current_user', JSON.stringify(this.currentUser));
                        
                        window.location.hash = found.clientId;

                        this.loadClientProfileData();
                        this.fetchLiveChats();
                        this.loadBotProfileData();
                    } else {
                        this.loginError = 'ID Pengguna atau Kata Laluan Neural Salah!';
                    }
                },

                logout() {
                    this.isLoggedIn = false;
                    this.currentUser = null;
                    this.liveChats = [];
                    this.activeChat = null;
                    localStorage.removeItem('leea_current_user');
                    window.location.hash = '';
                },

                getTotalChatCount() {
                    return this.liveChats.length;
                },

                getTodayChatCount() {
                    return this.liveChats.length; 
                },

                getMonthlyChatCount() {
                    return this.liveChats.length;
                },

                getAiHandledPercentage() {
                    if (this.liveChats.length === 0) return '0%';
                    let ai = this.liveChats.filter(c => c.mode === 'ai').length;
                    return Math.round((ai / this.liveChats.length) * 100) + '%';
                },

                getRemainingFreeQuota() {
                    let total = this.getTotalChatCount();
                    let rem = 1000 - total;
                    return rem >= 0 ? rem : 0;
                },

                calculateMetaCost() {
                    let totalChats = this.getTotalChatCount();
                    let paidChats = totalChats - 1000;
                    if (paidChats > 0) {
                        let cost = paidChats * 0.003;
                        return 'RM ' + cost.toFixed(3);
                    }
                    return 'RM 0.000';
                }
            }
        }
    </script>
</body>
</html>
